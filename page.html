<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0a16">
<title>PAYTON'S LiDAR SENSOR</title>
<style>
/* Everything is inline: the app is served by the sensor itself and works with no internet. */
:root{
  --bg:#0c0a16;--card:#16142a;--card2:#1f1c3a;--text:#f3f1ff;--muted:#a49fc9;--line:#2c2850;
  --pink:#ff2d8a;--purple:#8b5cf6;--blue:#22b8ff;--good:#3ee08f;--warn:#ffb020;--bad:#ff4d6d;
  --tint:linear-gradient(135deg,rgba(255,45,138,.16),rgba(139,92,246,.16),rgba(34,184,255,.16));
  --tint-strong:linear-gradient(135deg,rgba(255,45,138,.32),rgba(139,92,246,.32),rgba(34,184,255,.32));
  --c1:#ff2d8a;--c2:#8b5cf6;--c3:#22b8ff;--c4:#ffb020;
  --display:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#ffffff;--card:#f6f4fd;--card2:#ece8fb;--text:#17142c;--muted:#5f5a80;--line:#dcd6f3;
  --pink:#e0147a;--purple:#7444e8;--blue:#0f8fd6;--good:#13a35f;--bad:#d62650;color-scheme:light}}
:root[data-theme="light"]{--bg:#ffffff;--card:#f6f4fd;--card2:#ece8fb;--text:#17142c;--muted:#5f5a80;--line:#dcd6f3;
  --pink:#e0147a;--purple:#7444e8;--blue:#0f8fd6;--good:#13a35f;--bad:#d62650;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.6px;white-space:nowrap}
.brand b{background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good)}.pill.off{color:var(--bad)}
main{max-width:680px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1{font-family:var(--display);font-size:30px;line-height:1.05;margin:4px 0 12px;letter-spacing:.3px;text-wrap:balance}
h2{font-family:var(--display);font-size:22px;margin:22px 0 10px;letter-spacing:.3px}
h3{font-size:15px;margin:14px 0 6px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;min-width:0}
.card.tint{background:var(--tint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.res{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.res.hero{grid-column:1/-1;background:var(--tint)}
.res .v{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.1}
.res.hero .v{font-size:50px}
.res .u{font-size:15px;color:var(--muted);font-weight:600;margin-left:3px}
.res .s{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;margin-top:6px}
.tag.up{color:var(--good);border:1px solid var(--good)}.tag.flat{color:var(--blue);border:1px solid var(--blue)}.tag.down{color:var(--bad);border:1px solid var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer}
.btn.big{width:100%;padding:18px;font-size:19px;border-radius:16px}
.btn.primary{background:var(--tint-strong)}
.btn.armed{background:linear-gradient(135deg,rgba(139,92,246,.45),rgba(34,184,255,.45));animation:pulse 1.2s infinite}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
@keyframes pulse{50%{opacity:.72}}
@media (prefers-reduced-motion: reduce){.btn.armed{animation:none}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:700;padding:10px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--text);background:var(--tint-strong)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--tint-strong);border-color:transparent}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--tint-strong);border-color:transparent}
.opt b{display:block;font-size:16px}.opt span{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;min-width:0}
.field{display:grid;gap:5px;margin-bottom:10px}
.switch{position:relative;width:52px;height:30px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--card2);border:1px solid var(--line);transition:.2s}
.switch span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + span{background:linear-gradient(90deg,rgba(255,45,138,.6),rgba(139,92,246,.6))}
.switch input:checked + span:before{transform:translateX(22px)}
.status{font-family:var(--display);font-weight:800;font-size:58px;letter-spacing:1px;line-height:1;margin:6px 0}
.live{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.list .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;font-weight:800}
.check.on{background:var(--tint-strong);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.tw{overflow-x:auto}
svg text{font-family:var(--ui)}
.chart svg{width:100%;height:auto;display:block}
.lc{width:100%;position:relative;margin-top:8px;user-select:none;-webkit-user-select:none}.lc svg{display:block}
.lcleg{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.lcleg span{display:inline-flex;align-items:center;gap:6px}
.lcleg .ln{display:inline-block;width:16px;height:3px;border-radius:2px}
.lcleg .ds{display:inline-block;width:0;height:13px;border-left:1.5px dashed var(--muted)}
.lcleg .mk{display:inline-block;width:7px;height:7px;border-radius:50%;border:2px solid;background:var(--card)}
.lcleg .detail{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 13px;font-weight:600;font-size:12.5px;cursor:pointer}
.lcleg .detail[aria-pressed="true"]{background:var(--tint-strong);color:var(--text)}
.bullets{margin:6px 0 0;padding-left:18px}.bullets li{margin:6px 0}
.howto ol{margin:6px 0 0;padding-left:20px}.howto li{margin:6px 0}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* bottom bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;padding:4px 0;cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--text)}
.tabbar .plus{justify-self:center;width:60px;height:60px;margin-top:-26px;border-radius:50%;background:var(--tint-strong);border:4px solid var(--bg);color:var(--text);display:grid;place-items:center}
.tabbar .plus svg{width:28px;height:28px}
button:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.hidden{display:none!important}
/* ---------- printable report ---------- */
#report{position:fixed;inset:0;z-index:50;background:#e9e6f3;overflow:auto;-webkit-overflow-scrolling:touch}
#report .bar{position:sticky;top:0;display:flex;gap:8px;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:#17142c;color:#fff;z-index:2}
#report .bar button{background:#2b2550;color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.page{--ink:#1d1838;--ink2:#5b5680;--rule:#dcd7ee;--acc:#e0147a;--acc2:#7444e8;--acc3:#0f8fd6;--soft:#fbe7f1;
  width:816px;height:1056px;overflow:hidden;margin:16px auto;background:#fff;color:var(--ink);padding:34px 40px 24px;font-family:var(--ui);font-size:12.5px;line-height:1.45;position:relative;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.page .rhead{display:flex;gap:0;margin-bottom:12px}
.page .rhead span{font-family:var(--display);font-weight:700;letter-spacing:2px;font-size:12px;padding:6px 12px}
.page .rhead span:first-child{background:var(--ink);color:#fff;border-radius:4px 0 0 4px}
.page .rhead span:last-child{color:var(--ink2)}
.page .box{border:1px solid var(--rule);border-radius:12px;padding:14px 16px 12px;margin-bottom:12px;position:relative}
.page .box.btop{border-top:6px solid var(--ink)}
.page .logo{display:flex;align-items:center;gap:10px}
.page .logo .mark{width:46px;height:30px}
.page .logo .name{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:1px;line-height:1}
.page .logo .name b{color:var(--acc)}
.page .logo .tagline{font-size:10px;letter-spacing:.6px;color:var(--ink2)}
.page .eyebrow{font-family:var(--display);letter-spacing:2px;font-size:11.5px;color:var(--ink2);font-weight:700}
.page .who{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05}
.page .metrics{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1fr;border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:10px}
.page .m{padding:10px 12px;border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
.page .m .k{font-size:11px;color:var(--ink2)}
.page .m .v{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.page .m .v small{font-family:var(--ui);font-size:11px;font-weight:600;color:var(--ink2);margin-left:2px}
.page .m.hero{grid-row:1/3;border-left:0;border-top:0;display:flex;flex-direction:column;justify-content:center}
.page .m.hero .v{font-size:58px;color:var(--acc)}
.page .m.r1{border-top:0}
.page .sum{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px;margin:6px 0 0;padding:0;list-style:none}
.page .sum li{position:relative;padding-left:16px;margin:4px 0}
.page .sum li:before{content:"";position:absolute;left:0;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.page .next{background:var(--soft);border-radius:8px;padding:9px 12px;margin-top:10px}
.page .next b{font-family:var(--display);letter-spacing:2px;color:var(--acc);margin-right:10px}
.page h4{font-family:var(--display);font-size:19px;margin:0 0 8px}
.page .foot{position:absolute;left:40px;right:40px;bottom:36px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;margin-top:6px;font-size:11px}
.page .fine{position:absolute;left:40px;right:40px;bottom:16px;font-size:10px;color:var(--ink2);display:flex;justify-content:space-between}
.page .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.page table{font-size:12px}
.page th,.page td{border-bottom:1px solid var(--rule);padding:2px 4px;font-size:10.5px}
.page th{color:var(--ink2);font-size:10.5px}
.page .sect td{font-family:var(--display);font-weight:700;letter-spacing:1.5px;font-size:11.5px;text-align:left;padding-top:9px;color:var(--ink)}
.page .splitrow{display:grid;grid-template-columns:62px 1fr 64px 46px;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--rule)}
.page .splitrow b{font-family:var(--display);font-size:14px}
.page .splitrow .barbg{height:16px;background:#eeebf6;border-radius:3px;overflow:hidden}
.page .splitrow .barbg i{display:block;height:100%;background:var(--ink)}
.page .splitrow.best .barbg i{background:var(--acc)}
.page .splitrow .sp{color:var(--ink2);font-variant-numeric:tabular-nums}
.page .splitrow .tm{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.page .tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.page .tile{border:1px solid var(--rule);border-radius:8px;padding:6px 10px;min-width:74px}
.page .tile .k{font-size:10.5px;color:var(--ink2)}.page .tile .v{font-weight:800;font-size:14px}
.page .tile.hl{background:var(--soft);border-color:var(--acc)}
.page .fvtop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.page .fvtop div{border-top:4px solid var(--ink);padding-top:6px}
.page .fvtop div.acc{border-color:var(--acc)}
.page .fvtop .v{font-family:var(--display);font-weight:800;font-size:26px}
.page .kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border-top:1px solid var(--rule);margin-top:8px}
.page .kv div{padding:3px 0;border-bottom:1px solid var(--rule)}
.page .kv div:nth-child(even){text-align:right;font-weight:800}
.page svg{display:block;width:100%;height:auto}
.page svg text{font-family:var(--ui)}
@media print{
  @page{size:letter;margin:0}
  body > *:not(#report){display:none!important}
  #report{position:static;background:#fff;overflow:visible}
  #report .bar{display:none}
  .page{margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<body>
<header class="top">
  <div class="brand">PAYTON'S <b>LiDAR</b> SENSOR</div>
  <span id="conn" class="pill off">No sensor</span>
</header>
<main id="app"></main>
<nav class="tabbar" aria-label="Main">
  <button data-go="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button data-go="sessions" aria-label="Sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Sessions</button>
  <button data-go="new" class="plus" aria-label="New run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-go="analytics" aria-label="Analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analytics</button>
  <button data-go="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="report" class="hidden"></div>
<script>
// ===== ENGINE START =====
// Measurement engine for PAYTON'S LiDAR SENSOR.
// One smoothed distance line is made first; speed, splits, top speed and the takeoff all come from it.
const Engine = (() => {
  const FT = 0.3048;

  // ---------- filters ----------
  function biquadLP(fc, fs) {
    const w0 = (2 * Math.PI * fc) / fs, c = Math.cos(w0), al = Math.sin(w0) / (2 * Math.SQRT1_2);
    const a0 = 1 + al;
    return { b0: (1 - c) / 2 / a0, b1: (1 - c) / a0, b2: (1 - c) / 2 / a0, a1: (-2 * c) / a0, a2: (1 - al) / a0 };
  }
  function runBiquad(x, q) {
    const y = new Float64Array(x.length);
    let x1 = x[0], x2 = x[0], y1 = x[0], y2 = x[0];
    for (let i = 0; i < x.length; i++) {
      const v = q.b0 * x[i] + q.b1 * x1 + q.b2 * x2 - q.a1 * y1 - q.a2 * y2;
      x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v;
    }
    return y;
  }
  // zero-phase low-pass (forward + backward), with mirrored padding so the ends don't droop
  function filtfilt(x, fc, fs) {
    const n = x.length, pad = Math.min(n - 1, Math.round((3 * fs) / fc));
    const ext = new Float64Array(n + 2 * pad);
    for (let i = 0; i < pad; i++) { ext[i] = 2 * x[0] - x[pad - i]; ext[n + pad + i] = 2 * x[n - 1] - x[n - 2 - i]; }
    ext.set(x, pad);
    const q = biquadLP(fc, fs);
    let y = runBiquad(ext, q);
    y.reverse(); y = runBiquad(y, q); y.reverse();
    return y.slice(pad, pad + n);
  }
  function deriv(x, fs) {
    const n = x.length, v = new Float64Array(n);
    for (let i = 1; i < n - 1; i++) v[i] = ((x[i + 1] - x[i - 1]) * fs) / 2;
    v[0] = v[1]; v[n - 1] = v[n - 2];
    return v;
  }

  // ---------- 1) raw sensor frames → one clean, evenly spaced distance track ----------
  function track(raw) {
    const n = raw.t.length;
    if (n < 300) return { error: "Not enough data recorded." };
    // The sensor sends frames at a fixed rate: fit time vs frame number to remove Wi-Fi/serial jitter.
    let sx = 0, sy = 0, sxx = 0, sxy = 0;
    const t0 = raw.t[0];
    for (let i = 0; i < n; i++) { const y = (raw.t[i] - t0) | 0; sx += i; sy += y; sxx += i * i; sxy += i * y; }
    const b = (n * sxy - sx * sy) / (n * sxx - sx * sx), a = (sy - b * sx) / n;
    const fs = 1e6 / b;
    const T = [], D = [];
    for (let i = 0; i < n; i++) { const cm = raw.d[i]; if (cm > 10 && cm < raw.maxCm) { T.push((a + b * i) / 1e6); D.push(cm / 100); } }
    if (T.length < 300) return { error: "The sensor didn't see the athlete for most of the run. Check the aim." };
    // Drop single bad readings (arms, the pole, background) with a running median.
    const W = 15, kt = [], kd = [];
    for (let k = 0; k < D.length; k++) {
      const lo = Math.max(0, k - W), hi = Math.min(D.length, k + W + 1);
      const win = D.slice(lo, hi).sort((p, q) => p - q), med = win[win.length >> 1];
      if (Math.abs(D[k] - med) < 0.35) { kt.push(T[k]); kd.push(D[k]); }
    }
    // Split into continuous pieces (a gap over 0.12 s = athlete lost) and keep the piece that travels furthest.
    const pieces = []; let s = 0;
    for (let k = 1; k <= kt.length; k++) if (k === kt.length || kt[k] - kt[k - 1] > 0.12) { pieces.push([s, k]); s = k; }
    let best = pieces[0], bestGain = -1;
    for (const [p0, p1] of pieces) {
      if (p1 - p0 < 50) continue;
      let mn = Infinity, mx = -Infinity; for (let k = p0; k < p1; k++) { mn = Math.min(mn, kd[k]); mx = Math.max(mx, kd[k]); }
      if (mx - mn > bestGain) { bestGain = mx - mn; best = [p0, p1]; }
    }
    // Resample that piece onto an even grid.
    const [p0, p1] = best, dt = 1 / fs;
    const m = Math.floor((kt[p1 - 1] - kt[p0]) / dt) + 1;
    const d = new Float64Array(m); let j = p0;

      const t = kt[p0] + i * dt;

  }

  // ---------- 2) smooth distance, then speed from it ----------
  const SMOOTH_HZ = 3;     // the one line: splits, speed curve and top speed all use this
  const STEP_HZ = 7;       // keeps the per-step speed wobble, only used to find foot contacts
  const RAW_HZ = 12;
  const STRIDE_S = 0.46;   // one stride (two steps) for the speed curve and top speed       // "raw speed" line drawn on charts
  function lines(tr) {
    const ds = filtfilt(tr.d, SMOOTH_HZ, tr.fs);
    const v = deriv(ds, tr.fs);
    const vStep = deriv(filtfilt(tr.d, STEP_HZ, tr.fs), tr.fs);
    const vRaw = deriv(filtfilt(tr.d, RAW_HZ, tr.fs), tr.fs);
    // stride speed: distance covered over one stride (~0.46 s, two steps) of the same smoothed line,
    // so the curve shows the run, not the small speed-up/slow-down inside every step
    const h = Math.round(STRIDE_S / 2 * tr.fs), n = ds.length, vStride = new Float64Array(n);
    for (let k = 0; k < n; k++) { const a = Math.max(0, k - h), b = Math.min(n - 1, k + h); vStride[k] = b > a ? (ds[b] - ds[a]) / ((b - a) / tr.fs) : v[k]; }
    return { d: tr.d, ds, v, vStep, vRaw, vStride };
  }

  // time when the smoothed distance first reaches x (searching from index k0)
  function crossTime(ds, fs, k0, x) {
    if (ds[k0] >= x) return k0 / fs;
    for (let k = k0 + 1; k < ds.length; k++) if (ds[k] >= x) { const f = (x - ds[k - 1]) / ((ds[k] - ds[k - 1]) || 1e-9); return (k - 1 + f) / fs; }
    return NaN;
  }

  // ---------- 3) foot contacts and lefts ----------
  // Each foot contact slows the trunk a little, then the push speeds it up again: one wobble in speed per step.
  // We take that wobble (step-speed minus smoothed speed), keep only step-like frequencies (1.8–6.5 Hz), and
  // follow its phase: one full turn = one step, a contact sits at the bottom of each turn. Counting turns is
  // much steadier than hunting for individual dips. Then we walk back from the takeoff (a left) and stop at
  // the first step that breaks the rhythm, so hops, skips and walk-ins aren't counted.
  function fft(re, im, inv) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = ((inv ? 2 : -2) * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const ar = re[i + k], ai = im[i + k], br = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, bi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
          re[i + k] = ar + br; im[i + k] = ai + bi; re[i + k + len / 2] = ar - br; im[i + k + len / 2] = ai - bi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
    if (inv) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
  }
  function stepPhase(L, fs, kFrom, kTo) {
    const dec = Math.max(1, Math.round(fs / 200)), f2 = fs / dec;
    const m = Math.floor((kTo - kFrom) / dec) + 1;
    let N = 1; while (N < m * 2) N <<= 1;
    const re = new Float64Array(N), im = new Float64Array(N);
    // use the distance wobble (raw distance minus the smooth line): less noisy than a speed wobble
    for (let i = 0; i < m; i++) { const k = kFrom + i * dec; let a = 0; for (let q = 0; q < dec; q++) a += L.d[Math.min(L.d.length - 1, k + q)] - L.ds[Math.min(L.d.length - 1, k + q)]; re[i] = a / dec / Math.max(1, L.v[k]); }
    // taper the ends a little
    const tap = Math.min(m >> 3, Math.round(0.2 * f2));
    for (let i = 0; i < tap; i++) { const w = 0.5 - 0.5 * Math.cos((Math.PI * i) / tap); re[i] *= w; re[m - 1 - i] *= w; }
    fft(re, im, false);
    for (let i = 0; i < N; i++) {
      const f = i <= N / 2 ? (i * f2) / N : -((N - i) * f2) / N;
      if (f < 1.8 || f > 6.5) { re[i] = 0; im[i] = 0; } else { re[i] *= 2; im[i] *= 2; }   // analytic, band-limited
    }
    fft(re, im, true);

    for (let i = 0; i < m; i++) {
      let p = Math.atan2(im[i], re[i]) + Math.PI / 2;   // speed wobble leads the distance wobble by a quarter turn
      if (i) { while (p + off - prev > Math.PI) off -= 2 * Math.PI; while (p + off - prev < -Math.PI) off += 2 * Math.PI; }

  // contacts = where the phase passes the bottom of the wobble (π, 3π, ...)
  function contactsFromPhase(S, L) {
    let out = [];
    // phase only moves forward (stops wobbles around a crossing from counting twice)
    const mono = new Float64Array(S.m); mono[0] = S.ph[0];
    for (let i = 1; i < S.m; i++) mono[i] = Math.max(mono[i - 1], S.ph[i]);
    for (let i = 1; i < S.m; i++) {
      const a = mono[i - 1], b = mono[i];

    }
    out = out.map((k) => Math.round(k));
    // merge contacts that are far closer together than the steps around them (a phase slip, not a step)
    const fsx = S.f2 * S.dec;
    let changed = true;
    while (changed && out.length > 3) {
      changed = false;
      for (let i = 1; i < out.length; i++) {
        const lo = Math.max(1, i - 3), hi = Math.min(out.length - 1, i + 3), ivs = [];
        for (let j = lo; j <= hi; j++) if (j !== i) ivs.push(out[j] - out[j - 1]);
        const med = ivs.sort((a, b) => a - b)[ivs.length >> 1] || 0;
        if (out[i] - out[i - 1] < 0.62 * med && out[i] - out[i - 1] < 0.2 * fsx) { out.splice(i, 1, Math.round((out[i] + out[i - 1]) / 2)); out.splice(i - 1, 1); changed = true; break; }
      }
    }
    return out;
  }
  // kAnchor = where we expect the last contact (the takeoff for vault)
  function trackSteps(L, fs, kGo, kEnd, kAnchor) {
    const kFrom = Math.max(0, kGo - Math.round(0.6 * fs)), kTo = Math.min(L.v.length - 1, kEnd + Math.round(0.2 * fs));
    const S = stepPhase(L, fs, kFrom, kTo);
    const contacts = contactsFromPhase(S, L);
    // takeoff / last step: carry the rhythm of the steady steps just before the plant forward to it,
    // then use the contact that sits there (or the predicted spot if the plant blurred that dip)
    let lastIdx = -1;
    // (the plant bends the last ~0.3 s of the wobble, so only trust contacts before that)
    const before = contacts.filter((k) => k < kAnchor - 0.3 * fs);
    if (before.length >= 4) {
      const iv = []; for (let i = before.length - 4; i < before.length; i++) iv.push(before[i] - before[i - 1]);
      const Im = iv.sort((a, b) => a - b)[iv.length >> 1];

      const chain = before.slice();
      while (cur + 0.5 * Im <= kAnchor + 0.06 * fs) {
        const pred = cur + Im;

        cur = snap != null ? snap : Math.round(pred); chain.push(cur);
      }
      contacts.splice(0, contacts.length, ...chain);
      lastIdx = contacts.length - 1;
    } else {
      let bestD = 0.12 * fs;
      contacts.forEach((k, i) => { const d = Math.abs(k - kAnchor); if (d <= bestD) { bestD = d; lastIdx = i; } });
    }
    if (lastIdx < 0) return [];
    // typical wobble size during the run, to spot where the rhythm fades out
    const ampAt = (k) => S.amp[Math.max(0, Math.min(S.m - 1, Math.round((k - S.kFrom) / S.dec)))];
    // (skip the last two steps: the plant makes the wobble there look bigger than it is)
    const amps = contacts.slice(Math.max(0, lastIdx - 10), Math.max(1, lastIdx - 1)).map(ampAt).sort((a, b) => a - b);
    const refAmp = amps[amps.length >> 1] || 0;

    let guesses = 0;
    for (let i = lastIdx - 1; i >= 0; i--) {
      const last = out[out.length - 1], k = contacts[i], dt = (last - k) / fs;
      // reference = median of the last three step times we accepted (one noisy step won't break the count)
      const recent = []; for (let j = Math.max(1, out.length - 3); j < out.length; j++) recent.push((out[j - 1] - out[j]) / fs);
      const ref = recent.length ? recent.sort((a, b) => a - b)[recent.length >> 1] : dt;
      if (L.v[k] < 1.5) break;                                            // before the run started
      if (out.length > 1 && dt < ref * 0.6) continue;                     // a stray contact between two steps: skip it
      if (dt < 0.17) continue;
      if (out.length > 1 && dt >= ref * 1.7 && dt <= ref * 2.3 && L.v[k] > 4 && guesses < 2) {
        out.push(Math.round((last + k) / 2)); guesses++;                  // one dip missed inside a steady rhythm
      } else if (dt > 0.5 || (out.length > 1 && dt > ref * 1.8)) break;  // rhythm breaks (hop, skip, walk-in)
      // wobble gone for two steps in a row: no real steps here
      if (ampAt(k) < 0.2 * refAmp && i > 0 && ampAt(contacts[i - 1]) < 0.2 * refAmp) break;
      out.push(k);
    }
    return out.reverse();
  }

  // ---------- 4) force–velocity profile (simple model, no air resistance) ----------
  function fvProfile(L, fs, kGo, kTop, mass) {
    // fit v(t) = vmax * (1 - e^(-t/tau)) to the smoothed speed from the start to top speed
    let best = null;
    const n = kTop - kGo; if (n < fs * 0.8) return null;
    const stepK = Math.max(1, Math.round(fs / 100));
    for (let tau = 0.5; tau <= 2.5; tau += 0.005) {
      let sxy = 0, sxx = 0;
      for (let k = kGo; k <= kTop; k += stepK) { const x = 1 - Math.exp(-((k - kGo) / fs) / tau); sxy += x * L.v[k]; sxx += x * x; }
      const vmax = sxy / sxx; let err = 0;
      for (let k = kGo; k <= kTop; k += stepK) { const e = L.v[k] - vmax * (1 - Math.exp(-((k - kGo) / fs) / tau)); err += e * e; }
      if (!best || err < best.err) best = { tau, vmax, err };
    }
    const { tau, vmax } = best, F0 = vmax / tau, P0 = (F0 * vmax) / 4, slope = -F0 / vmax;
    // model curves for power and force over the run
    let pk = 0, sumP = 0, sumF = 0, c = 0;
    const T = (kTop - kGo) / fs;
    for (let t = 0; t <= T; t += 0.01) { const a = (vmax / tau) * Math.exp(-t / tau), v = vmax * (1 - Math.exp(-t / tau)); const p = a * v; pk = Math.max(pk, p); sumP += p; sumF += a; c++; }
    return { tau, V0: vmax, F0, P0, slope, peakPowerKg: pk, meanPowerKg: sumP / c, meanForceKg: sumF / c,
      F0abs: mass ? F0 * mass : null, P0abs: mass ? P0 * mass : null, peakPower: mass ? pk * mass : null, meanPower: mass ? (sumP / c) * mass : null, meanForce: mass ? (sumF / c) * mass : null };
  }

  // ---------- main ----------
  // ctx: { mode: "sprint", target: m } | { mode: "vault", setup: "runway100" | "runway150" | "polerun" }, mass (kg, optional)
  function process(raw, ctx) {
    const tr = track(raw); if (tr.error) return tr;
    const fs = tr.fs, L = lines(tr), n = tr.d.length;
    // top speed of the whole recording (to find the run)
    let kTopAll = 0; for (let k = 0; k < n; k++) if (L.v[k] > L.v[kTopAll]) kTopAll = k;
    if (L.v[kTopAll] < 2) return { error: "No run found in this recording." };
    // start: the last moment before the run where speed was under 0.2 m/s
    const START_MS = 0.2;
    let kGo = -1; for (let k = kTopAll; k >= 0; k--) if (L.v[k] < START_MS) { kGo = k; break; }
    if (kGo < 0) {
      // already moving when the sensor first saw them (start out of view)
      if (ctx.mode === "sprint") return { error: "The sensor didn't see the start. Stand still in the beam before you go." };
      kGo = 0;
    }
    // refine to the exact crossing
    const goT = Math.max(kGo, Math.min(kGo + 1, kGo + (START_MS - L.v[kGo]) / ((L.v[kGo + 1] - L.v[kGo]) || 1e-9)));
    const tGo = goT / fs, dGo = L.ds[kGo] + (L.ds[kGo + 1] - L.ds[kGo]) * (goT - kGo);
    const at = (dist) => crossTime(L.ds, fs, kGo, dGo + dist) - tGo;      // time from start to a distance
    const speedAtK = (k) => L.v[Math.max(0, Math.min(n - 1, k))];

    const res = { ctx, fs, start: { threshold: START_MS, t: tGo, d: dGo } };

    // ----- where the run ends -----
    let kEnd = n - 1;
    if (ctx.mode === "sprint") {
      const tf = crossTime(L.ds, fs, kGo, dGo + ctx.target);
      if (!isFinite(tf)) return { error: `The run didn't reach ${ctx.target} m. Check the target distance or the aim.` };
      kEnd = Math.min(n - 1, Math.ceil(tf * fs));
    } else {
      for (let k = kTopAll + 1; k < n; k++) if (L.v[k] < 0.75 * L.v[kTopAll]) { kEnd = k; break; }
    }
    // top speed within the run
    // top speed = fastest stride, so a single step or a noisy reading can't set it
    let kTop = kGo; for (let k = kGo; k <= kEnd; k++) if (L.vStride[k] > L.vStride[kTop]) kTop = k;
    res.top = { speed: L.vStride[kTop], t: kTop / fs - tGo, dist: L.ds[kTop] - dGo };

    // ----- steps -----
    // vault / pole run: count back from the takeoff (the plant shows up as a sudden ~10% drop in speed,
    // about 0.045 s after the takeoff contact); sprint: from the last contact before the finish
    let kAnchor = kEnd;
    if (ctx.mode === "vault") {
      const win = Math.round(0.5 * fs);
      for (let k = kTopAll; k < n; k++) {
        let mx = 0; for (let q = Math.max(0, k - win); q <= k; q += 5) mx = Math.max(mx, L.v[q]);
        if (L.vStep[k] < 0.9 * mx) { kAnchor = k - Math.round(0.045 * fs); break; }
      }
    }
    const stepKs = trackSteps(L, fs, kGo, kEnd, kAnchor);
    const takeoffK = ctx.mode === "vault" && stepKs.length ? stepKs[stepKs.length - 1] : null;
    res.steps = {
      counted: stepKs.length,
      lefts: Math.ceil(stepKs.length / 2),
      times: stepKs.map((k) => +(k / fs - tGo).toFixed(3)),
      firstAt: stepKs.length ? +(L.ds[stepKs[0]] - dGo).toFixed(2) : null,
    };

    if (ctx.mode === "sprint") {
      const T = ctx.target;
      res.time = at(T);
      res.avgSpeed = T / res.time;
      res.splits = [];
      for (let x = 5; x <= T + 1e-9; x += 5) { const t1 = at(x), t0 = x === 5 ? 0 : at(x - 5); res.splits.push({ from: x - 5, to: x, time: t1 - t0, at: t1, speed: 5 / (t1 - t0) }); }
      res.cum = {}; for (const x of [10, 20, 30, 40, 50, 60]) if (x <= T) res.cum[x] = at(x);
      // best flying 10 m inside the test distance

      if (T >= 10) for (let x = 0; x + 10 <= T + 1e-9; x += 0.05) { const dt = at(x + 10) - at(x); if (isFinite(dt) && (!fly || dt < fly.time)) fly = { from: x, to: x + 10, time: dt, speed: 10 / dt }; }
      res.fly10 = fly;

      for (let k = kGo; k <= kTop; k++) aPkRaw = Math.max(aPkRaw, (L.vRaw[Math.min(n - 1, k + 1)] - L.vRaw[Math.max(0, k - 1)]) * fs / 2);

      const seg = (a, b) => { const ta = crossTime(L.ds, fs, kGo, a), tb = crossTime(L.ds, fs, kGo, b); return isFinite(ta) && isFinite(tb) && tb > ta ? { time: tb - ta, speed: (b - a) / (tb - ta) } : null; };
      res.takeoff = { t: kTo / fs - tGo, dist: dTo - dGo, sensor: dTo, fromSteps: takeoffK != null };
      // stride speed must not reach past the takeoff (the plant slows the body, not the run-up)
      const h = Math.round(STRIDE_S / 2 * fs);
      for (let k = Math.max(0, kTo - h); k < n; k++) { const a = Math.max(0, Math.min(k, kTo) - h), b = Math.min(kTo, k + h); L.vStride[k] = b > a ? (L.ds[b] - L.ds[a]) / ((b - a) / fs) : L.v[k]; }
      let kT2 = kGo; for (let k = kGo; k <= kTo; k++) if (L.vStride[k] > L.vStride[kT2]) kT2 = k;
      res.top = { speed: L.vStride[kT2], t: kT2 / fs - tGo, dist: L.ds[kT2] - dGo };

      res.approachTime = kTo / fs - tGo;
      res.approachDist = dTo - dGo;
      if (ctx.setup === "runway100" || ctx.setup === "runway150") {

    const every = Math.max(1, Math.round(fs / 50)), kLast = Math.min(n - 1, kEnd + Math.round(0.25 * fs));

    for (let k = Math.max(0, kGo - Math.round(0.2 * fs)); k <= kLast; k += every) {

      curve.v.push(+L.vStride[k].toFixed(3)); curve.vr.push(+L.vRaw[k].toFixed(3));
    }
    res.curve = curve;
    res.rate = Math.round(fs);
    return res;
  }

  // ---------- simulated runs (demo + tests) ----------
  // A runner with per-step speed dips. opts: { vmax, tau, back (tripod behind start, m), target (m, sprint)
  //   or steps (vault: number of run-up steps, last = takeoff), hop (true = hop/skip before the run), seed, noise }
  function simulate(o) {

// speed over distance for one run (app view)

  if (!sprint && R.last5) bands.push({ a: R.takeoff.dist - 5, b: R.takeoff.dist, label: "last 5 m" });
  if (!sprint && R.steps.times.length) {
    const n = R.steps.times.length;
    R.steps.times.forEach((t, i) => { if ((n - 1 - i) % 2) return; const j = Math.max(0, c.t.findIndex((x) => x >= t)); if (j < k) marks.push({ x: c.d[j], y: c.v[j] }); });
  }
  return lcSlot({
    aria: "Speed along the run", h: 250, x0: 0, x1: Math.ceil(end), y0: 0, y1: ymax, xTitle: "Distance (m)", yUnit: "m/s", bands, marks,
    focus: { x: R.top.dist },
    fmtPill: (x, [val], def) => (def ? `Top ${f2(R.top.speed)} m/s at ${f1(R.top.dist)} m` : `${f2(val)} m/s at ${f1(x)} m`),

}

// ---------------- compare ----------------
let compareSel = [];
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];

function toggleCompare(id) {

}
function compareX(run) {
  // sprint: distance from the start. vault: distance before takeoff (0 = takeoff), so approaches line up
  return run.mode === "sprint" ? run.res.curve.d : run.res.curve.d.map((d) => d - run.res.takeoff.dist);
}
function interpAt(xs, ys, x) { if (x < xs[0] || x > xs[xs.length - 1]) return NaN; let j = 1; while (j < xs.length && xs[j] < x) j++; const f = (x - xs[j - 1]) / ((xs[j] - xs[j - 1]) || 1e-9); return ys[j - 1] + f * (ys[j] - ys[j - 1]); }
function compareText(list) {
  const out = [], names = list.map((r, i) => `${String.fromCharCode(65 + i)}`);
  const label = (i) => `${names[i]} (${esc(athleteById(list[i].athleteId).name.split(" ")[0])})`;
  const allSprint = list.every((r) => r.mode === "sprint"), allVault = list.every((r) => r.mode === "vault");
  if (allSprint) {
    const T = Math.min(...list.map((r) => r.target));
    const tAt = (r, x) => (x === r.target ? r.res.time : interpAt(r.res.curve.d, r.res.curve.t, x));
    const times = list.map((r) => tAt(r, T)), best = times.indexOf(Math.min(...times));
    out.push(`<b>${label(best)}</b> was fastest to ${T} m in <b>${f2(times[best])} s</b>.` + list.map((r, i) => (i === best ? "" : ` ${label(i)} was ${f2(times[i] - times[best])} s behind.`)).join(""));
    // where the gap appears
    for (let i = 0; i < list.length; i++) {
      if (i === best) continue;
      let at = null; for (let x = 5; x <= T; x += 5) if (tAt(list[i], x) - tAt(list[best], x) > 0.05) { at = x; break; }
      let worst = null, wd = 0; for (let x = 5; x <= T; x += 5) { const dd = (tAt(list[i], x) - tAt(list[i], x - 5)) - (tAt(list[best], x) - tAt(list[best], x - 5)); if (dd > wd) { wd = dd; worst = x; } }
      if (at != null) out.push(`${label(i)} fell more than 0.05 s behind by <b>${at} m</b>; the most time went in the <b>${worst - 5}–${worst} m</b> split (${f2(wd)} s).`);
    }
    const tops = list.map((r) => r.res.top.speed), tb = tops.indexOf(Math.max(...tops));
    out.push(`Highest top speed: <b>${label(tb)} ${f2(tops[tb])} m/s</b>` + (list.length > 1 ? `, ${f2(tops[tb] - Math.min(...tops))} m/s above the lowest.` : "."));
  } else if (allVault) {
    const l5 = list.map((r) => (r.res.last5 ? r.res.last5.speed : NaN)), b = l5.indexOf(Math.max(...l5.filter(isFinite)));
    if (b >= 0) out.push(`Fastest into takeoff: <b>${label(b)} ${f2(l5[b])} m/s</b> over the last 5 m.`);
    const lefts = list.map((r) => r.res.steps.lefts);
    if (new Set(lefts).size > 1) out.push(`Lefts differ: ${list.map((r, i) => `${names[i]} ${lefts[i] || "?"}`).join(", ")}.`);
    const tos = list.map((r) => r.res.takeoff.outFt).filter((x) => x != null);
    if (tos.length > 1) out.push(`Takeoff spots spread over <b>${ftLabel(Math.max(...tos) - Math.min(...tos))}</b> (${list.map((r, i) => `${names[i]} ${ftLabel(r.res.takeoff.outFt)}`).join(", ")}).`);
    list.forEach((r, i) => { const c = changeTag(r.res); if (c && c.cls === "down") out.push(`${label(i)}: ${c.text.toLowerCase()}.`); });

      if (Math.max(...vs) - Math.min(...vs) > 0.25) { run += 0.5; if (run >= 2 && where == null) where = x - 2; } else run = 0;
    }
    out.push(where == null ? "The speed curves stay within 0.25 m/s of each other the whole way." : `The speed curves split apart around <b>${allVault ? `${f1(Math.abs(where))} m before takeoff` : `${f1(where)} m`}</b>.`);
  }
  return out;
}
function compareHTML() {

  const xs = list.map(compareX), x0 = Math.floor(Math.min(...xs.map((x) => x[0]))), x1 = Math.ceil(Math.max(...xs.map((x) => x[x.length - 1])));

    fmtPill: (x, vals) => vals.map((v, i) => (isFinite(v) ? `${String.fromCharCode(65 + i)} ${f2(v)}` : "")).filter(Boolean).join("  ") + ` · ${f1(Math.abs(x))} m`,
    series: cut.map((c, i) => ({ x: c.x, y: c.y, color: COLORS[i], w: 2.4, fill: list.length === 1 })) });
  let h = `<div class="between"><h1>Compare</h1><button class="btn sm" data-act="cmp-clear">Clear</button></div>`;
  h += `<div class="card"><div class="chips" style="margin-bottom:8px">${list.map((r, i) => `<span class="chip" style="cursor:default"><span class="dot" style="background:${COLORS[i]}"></span>${String.fromCharCode(65 + i)} · ${esc(athleteById(r.athleteId).name)} · ${testShort(testKey(r))} · ${dayLabel(dayKey(r.ts))}</span>`).join("")}</div>
    ${chart}<div class="small muted" style="margin-top:6px">${allVault ? "Lined up at the takeoff, so different start marks still compare." : "Distance from the start."} Drag across the chart to read each run's speed.</div></div>`;
  h += `<div class="card"><div class="label">What's different</div><ul class="bullets">${compareText(list).map((t) => `<li>${t}</li>`).join("")}</ul></div>`;

       ...[5, 10, 15, 20, 25, 30, 40, 50, 60].filter((x) => list.some((r) => r.target >= x)).map((x) => [`0–${x} m`, (r) => (r.target >= x ? `${f2(x === r.target ? r.res.time : interpAt(r.res.curve.d, r.res.curve.t, x))}` : "—")])]
    : [["Last 5 m", (r) => f2(r.res.last5 && r.res.last5.speed)], ["10 → 5 m out", (r) => f2(r.res.prev5 && r.res.prev5.speed)], ["Top speed", (r) => f2(r.res.top.speed)], ["Lefts", (r) => r.res.steps.lefts || "—"],

  h += `<div class="card tw"><table><thead><tr><th></th>${list.map((r, i) => `<th style="color:${COLORS[i]}">${String.fromCharCode(65 + i)}</th>`).join("")}</tr></thead><tbody>`;

function setupGuide(setup) {

// analytics: trends and personal records per athlete
const anState = { athleteId: null, test: null };
function analyticsHTML() {
  if (!athletes.length) return `<h1>Analytics</h1><div class="card empty">Add an athlete and save some runs to see trends.</div>`;
  if (!anState.athleteId || !athletes.find((a) => a.id === anState.athleteId)) anState.athleteId = settings.lastAthlete && athletes.find((a) => a.id === settings.lastAthlete) ? settings.lastAthlete : athletes[0].id;
  const mine = runs.filter((r) => r.athleteId === anState.athleteId);
  let h = `<h1>Analytics</h1><div class="chips" style="margin-bottom:12px">${athletes.map((a) => `<button class="chip" data-act="an-ath" data-id="${a.id}" aria-pressed="${a.id === anState.athleteId}">${esc(a.name)}</button>`).join("")}</div>`;
  if (!mine.length) return h + `<div class="card empty">No runs for ${esc(athleteById(anState.athleteId).name)} yet.</div>`;
  const tests = [...new Set(mine.map(testKey))].sort();
  if (!anState.test || !tests.includes(anState.test)) anState.test = tests[0];
  h += `<div class="chips" style="margin-bottom:12px">${tests.map((t) => `<button class="chip" data-act="an-test" data-v="${t}" aria-pressed="${t === anState.test}">${testShort(t)}</button>`).join("")}</div>`;
  const tr = mine.filter((r) => testKey(r) === anState.test);
  const isSprint = anState.test.startsWith("sprint");
  // best per day
  const byDay = {}; for (const r of tr) { const v = headline(r).value; if (v == null || !isFinite(v)) continue; const k = dayKey(r.ts); if (!byDay[k] || (isSprint ? v < byDay[k].v : v > byDay[k].v)) byDay[k] = { v, r }; }
  const days = Object.keys(byDay).sort();
  if (days.length) {
    const t0 = new Date(days[0]).getTime(), X = days.map((d) => (new Date(d).getTime() - t0) / 864e5), Y = days.map((d) => byDay[d].v);
    const lo = Math.min(...Y), hi = Math.max(...Y), padY = Math.max(0.05, (hi - lo) * 0.25);
    const x1 = Math.max(1, X[X.length - 1]);
    const chart = lcSlot({ aria: "Best per day", h: 230, x0: -0.5, x1: x1 + 0.5, y0: lo - padY, y1: hi + padY, yUnit: isSprint ? "s" : "m/s",
      yfmt: (t) => t.toFixed(2), xt: X.length > 1 ? [X[0], X[X.length - 1]] : [X[0]], xfmt: (t) => dayLabel(days[X.indexOf(t)] || days[0]),
      series: [{ x: X, y: Y, color: "var(--purple)", w: 2.4, fill: !isSprint }],
      dots: X.map((x, i) => ({ x, y: Y[i], attrs: `data-act="open-session" data-id="${days[i]}" style="cursor:pointer"` })) });
    h += `<div class="card"><div class="between"><div class="label">Best ${isSprint ? "time" : "last 5 m"} per day</div><div class="small muted">${isSprint ? "lower is better" : "higher is better"}</div></div>${chart}<div class="small muted">Tap a dot to open that session.</div></div>`;
  }
  // records
  h += `<div class="card"><div class="label" style="margin-bottom:6px">Personal records · ${testName(anState.test)}</div><div class="list">`;
  const rec = (label, pick, better, fmt) => {
    let best = null; for (const r of tr) { const v = pick(r); if (v == null || !isFinite(v)) continue; if (!best || (better === "low" ? v < best.v : v > best.v)) best = { v, r }; }
    return best ? `<div class="item" data-act="open-run" data-id="${best.r.id}"><div>${label}<div class="small muted">${dayLabel(dayKey(best.r.ts))}</div></div><div class="r">${fmt(best.v)}</div></div>` : "";
  };
  if (isSprint) {
    h += rec("Time", (r) => r.res.time, "low", (v) => `${f2(v)} s`) + rec("Top speed", (r) => r.res.top.speed, "high", (v) => `${f2(v)} m/s`) + rec("Flying 10 m", (r) => r.res.fly10 && r.res.fly10.time, "low", (v) => `${f2(v)} s`);
  } else {
    h += rec("Last 5 m", (r) => r.res.last5 && r.res.last5.speed, "high", (v) => `${f2(v)} m/s`) + rec("Top speed", (r) => r.res.top.speed, "high", (v) => `${f2(v)} m/s`);
    const L = tr.map((r) => r.res.steps.lefts).filter(Boolean); if (L.length) h += `<div class="item" style="cursor:default"><div>Lefts<div class="small muted">${L.length} jumps</div></div><div class="r">${Math.min(...L) === Math.max(...L) ? Math.min(...L) : `${Math.min(...L)}–${Math.max(...L)}`}</div></div>`;
    const T = tr.map((r) => r.res.takeoff.outFt).filter((x) => x != null); if (T.length) h += `<div class="item" style="cursor:default"><div>Takeoff spots<div class="small muted">closest – farthest</div></div><div class="r">${ftLabel(Math.min(...T))} – ${ftLabel(Math.max(...T))}</div></div>`;
  }
  h += `</div></div>`;
  // fastest split at each distance (all sprints)
  if (isSprint) {
    const sprints = mine.filter((r) => r.mode === "sprint");
    let rows = "";
    for (const x of [5, 10, 15, 20, 25, 30, 40, 50, 60]) {
      let bc = null, bs = null;
      for (const r of sprints) {
        if (r.target < x) continue;
        const tc = x === r.target ? r.res.time : interpAt(r.res.curve.d, r.res.curve.t, x);
        if (isFinite(tc) && (!bc || tc < bc.v)) bc = { v: tc, r };
        const sp = r.res.splits.find((s) => s.to === x); if (sp && (!bs || sp.time < bs.v)) bs = { v: sp.time, r };
      }
      if (bc) rows += `<tr data-act="open-run" data-id="${bc.r.id}" style="cursor:pointer"><td>${x} m</td><td>${f2(bc.v)} s</td><td>${bs ? `${f2(bs.v)} s` : "—"}</td><td class="muted">${dayLabel(dayKey(bc.r.ts))}</td></tr>`;
    }
    if (rows) h += `<div class="card tw"><div class="label" style="margin-bottom:6px">Fastest at each distance · all sprints</div><table><thead><tr><th>Distance</th><th>From start</th><th>5 m split</th><th>When</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  h += `<h2>Runs</h2>` + compareBar() + `<div class="card list">${tr.slice(0, 30).map((r) => runRow(r, true)).join("")}</div>`;
  return h;
}

// ---------------- render ----------------
let backStack = [];
function render() {
  const app = $("#app");
  const html = view === "home" ? homeHTML() : view === "new" ? newHTML() : view === "run" ? runHTML(viewArg) : view === "sessions" ? sessionsHTML() : view === "session" ? sessionHTML(viewArg)
    : view === "compare" ? compareHTML() : view === "analytics" ? analyticsHTML() : view === "settings" ? settingsHTML() : view === "athlete" ? athleteFormHTML(viewArg) : homeHTML();
  app.innerHTML = html;
  lcDrawAll(); LC = Object.fromEntries(Object.entries(LC).filter(([k]) => document.querySelector(`[data-lc="${k}"]`)));
  const tab = { home: "home", new: "new", run: "sessions", sessions: "sessions", session: "sessions", compare: "analytics", analytics: "analytics", settings: "settings", athlete: "settings" }[view];
  document.querySelectorAll(".tabbar [data-go]").forEach((b) => (b.dataset.go === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
  const sw = $("#soloSw"); if (sw) sw.onchange = () => { settings.solo = sw.checked; saveSettings(); if (sw.checked) { voiceUnlocked = true; say("Solo mode on"); } };
  const ct = $("#customTarget"); if (ct) ct.onchange = () => { const v = parseInt(ct.value, 10); if (v >= 5 && v <= 80) { cap.target = v; settings.lastTarget = v; saveSettings(); render(); } };
  const imp = $("#importFile"); if (imp) imp.onchange = () => importBackup(imp.files[0]);
}
function nav(v, arg) { backStack.push([view, viewArg]); go(v, arg); }
function back() { const p = backStack.pop(); if (p) go(p[0], p[1]); else go("home"); }

document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"); if (g) { backStack = []; if (g.dataset.go === "new") voiceUnlocked = true; go(g.dataset.go); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (act === "cmp-toggle") { e.stopPropagation(); toggleCompare(id); return; }
  switch (act) {
    case "back": back(); break;
    case "lc-detail": lcDetail = !lcDetail; document.querySelectorAll('[data-act="lc-detail"]').forEach((b) => b.setAttribute("aria-pressed", lcDetail)); lcDrawAll(); break;
    case "open-run": nav("run", id); break;
    case "open-session": nav("session", id); break;
    case "cmp-clear": compareSel = []; render(); break;
    case "pick-ath": cap.athleteId = id; settings.lastAthlete = id; saveSettings(); render(); break;
    case "cap-mode": cap.mode = v; settings.lastMode = v; saveSettings(); render(); break;
    case "cap-target": cap.target = +v; settings.lastTarget = +v; saveSettings(); render(); break;
    case "cap-setup": cap.setup = v; settings.lastSetup = v; saveSettings(); render(); break;
    case "cap-ready": voiceUnlocked = true; arm(); break;
    case "cap-cancel": stopNow(); cap.phase = "setup"; render(); break;
    case "cap-stop": stopNow(); break;
    case "cap-sim": simulateRun(); break;
    case "cap-save": runs.unshift(cap.run); saveRuns(); toast("Saved"); arm(); break;
    case "cap-discard": toast("Thrown away"); arm(); break;
    case "cap-again": arm(); break;
    case "cap-done": stopNow(); cap.phase = "setup"; go("home"); break;
    case "open-report": openReport(id || (cap.run && cap.run.id)); break;
    case "del-run": if (el.dataset.confirm === "1") { runs = runs.filter((r) => r.id !== id); compareSel = compareSel.filter((x) => x !== id); saveRuns(); toast("Run deleted"); back(); } else { el.dataset.confirm = "1"; el.textContent = "Tap again to delete"; } break;
    case "an-ath": anState.athleteId = id; anState.test = null; render(); break;
    case "an-test": anState.test = v; render(); break;
    case "ath-new": nav("athlete", null); break;

// ---------------- backup ----------------
function exportBackup() {
  const blob = new Blob([JSON.stringify({ app: "paytons-lidar-sensor", v: 1, athletes, runs, settings }, null, 0)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `lidar-backup-${dayKey(Date.now())}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importBackup(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result); if (!j.runs || !j.athletes) throw 0;
      const haveA = new Set(athletes.map((a) => a.id)), haveR = new Set(runs.map((r) => r.id));
      athletes = athletes.concat(j.athletes.filter((a) => !haveA.has(a.id))); runs = runs.concat(j.runs.filter((r) => !haveR.has(r.id))).sort((a, b) => b.ts - a.ts);
      saveAthletes(); saveRuns(); toast(`Imported ${j.runs.length} runs`); render();
    } catch (e) { toast("That file isn't a backup from this app."); }
  };
  fr.readAsText(file);
}
function addDemoData() {
  let a = athletes.find((x) => x.name === "Demo Athlete");
  if (!a) { a = { id: uid(), name: "Demo Athlete", kg: 68 }; athletes.push(a); saveAthletes(); }
  const now = Date.now();
  for (let day = 13; day >= 0; day -= 3) {
    for (let rep = 0; rep < 2; rep++) {
      const ts = now - day * 864e5 - (3 - rep) * 600e3;
      const vmax = 8.7 + (13 - day) * 0.03 + Math.random() * 0.15;
      const s = Engine.simulate({ seed: Math.floor(Math.random() * 1e6) + 1, vmax, target: 30, back: 3 });
      const res = Engine.process(s.raw, { mode: "sprint", target: 30, mass: a.kg });
      if (!res.error) runs.push({ id: uid(), ts, athleteId: a.id, mode: "sprint", target: 30, res });
      const steps = 15 + (rep % 2);
      const sv = Engine.simulate({ seed: Math.floor(Math.random() * 1e6) + 1, vmax: vmax - 0.6, steps, back: 2.5 });
      const probe = Engine.process(sv.raw, { mode: "vault", setup: "runway100" });
      if (!probe.error) { const shift = Math.round((100 * FT - (11 + Math.random() * 2.5) * FT - 0.5 - probe.takeoff.sensor) * 100); sv.raw.d = sv.raw.d.map((cm) => (cm > 0 ? cm + shift : cm)); }
      const rv = Engine.process(sv.raw, { mode: "vault", setup: "runway100" });
      if (!rv.error) runs.push({ id: uid(), ts: ts + 300e3, athleteId: a.id, mode: "vault", setup: "runway100", res: rv });
    }
  }
  runs.sort((x, y) => y.ts - x.ts); saveRuns(); toast("Demo data added"); render();
}

      + sect("FORCE–VELOCITY PROFILE") + P("F0", fv.F0abs ? `${Math.round(fv.F0abs)} N` : "–", `${f2(fv.F0)} N/kg`) + P("V0", `${f2(fv.V0)} m/s`, "–") + P("P0", fv.P0abs ? `${Math.round(fv.P0abs)} W` : "–", `${f1(fv.P0)} W/kg`) + P("Force–velocity slope", fv.slope.toFixed(4), "–")
    : sect("ACCELERATION") + P("Peak acceleration", `${f2(R.accel.peak)} m/s²`, "–") + P("Mean acceleration", `${f2(R.accel.mean)} m/s²`, "–");
  const thead = `<thead><tr><th style="text-align:left">PARAMETER</th><th>ABSOLUTE</th><th>RELATIVE TO BODY WEIGHT</th></tr></thead>`;
  let p2 = `<div class="page"><div class="two">
    <div class="box"><h4>Splits</h4><div class="splitrow" style="color:${INK2};font-size:10.5px;letter-spacing:1px"><span>SEGMENT</span><span>AVERAGE SPEED</span><span></span><span style="text-align:right">TIME</span></div>
      ${R.splits.map((s, i) => `<div class="splitrow ${i === bestI ? "best" : ""}"><b>${s.from}–${s.to} m</b><div class="barbg"><i style="width:${((s.speed / (maxS * 1.1)) * 100).toFixed(1)}%"></i></div><span class="sp">${f2(s.speed)} m/s</span><span class="tm">${f2(s.time)} s</span></div>`).join("")}
      <div class="tiles">${tiles.join("")}</div></div>
    <div class="box"><h4>Force–velocity profile</h4>${fvBlock}</div></div>
    <div class="box"><h4>All parameters</h4><div class="two"><table>${thead}<tbody>${left}</tbody></table><table>${thead}<tbody>${right}</tbody></table></div>
    <div style="color:${INK2};font-size:10.5px;margin-top:6px">Speed, splits and top speed come from one smoothed distance line, so a single noisy reading can't set a top speed. Force and power come from the standard sprint model fitted to that speed curve (air resistance not included). Times start when speed passes ${R.start.threshold} m/s.</div></div>
    ${footer(2, 2)}</div>`;
  return p1 + p2;
}
function vaultReport(run) {
  const R = run.res, a = athleteById(run.athleteId), d = new Date(run.ts), c = changeTag(R);
  const when = `${d.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" })} · ${timeLabel(run.ts)}`;
  const sum = vaultSummary(run, a.name);
  const m = (k, v, u, sub, cls) => `<div class="m ${cls || ""}"><div class="k">${k}</div><div class="v">${v}${u ? `<small>${u}</small>` : ""}</div>${sub ? `<div class="k" style="margin-top:2px">${sub}</div>` : ""}</div>`;
  // speed before takeoff, with the lefts marked
  const cv = R.curve, xs = cv.d.map((x) => x - R.takeoff.dist), x0 = Math.max(-35, Math.floor(xs[0])), ymax = Math.ceil(R.top.speed + 1.5);
  const n = R.steps.times.length, dots = [];
  R.steps.times.forEach((t, i) => { const k = Math.max(0, cv.t.findIndex((x) => x >= t)), fromEnd = n - 1 - i, left = fromEnd % 2 === 0, lnum = Math.ceil((n - fromEnd) / 2) + (n % 2 === 0 ? 0 : 0);
    dots.push({ x: xs[k], y: 0.8, r: left ? 5 : 3, fill: left ? ACC : "#b9b4d2", label: left ? `${R.steps.lefts - Math.floor(fromEnd / 2)}` : "", dy: -9, tcolor: ACC }); });
  const svg = svgChart({ aria: "Speed before takeoff", w: 730, h: 190, pad: [44, 14, 30, 40], x0, x1: 1, y0: 0, y1: ymax, font: 11, textColor: INK2, gridColor: "#efecf6",
    xt: niceTicks(x0, 0, 8), xfmt: (t) => (t === 0 ? "takeoff" : `${Math.abs(t)} m`), yt: niceTicks(0, ymax, 5), xl: "Distance before takeoff", yl: "Speed (m/s)",
    shades: [{ a: -5, b: 0, color: ACC2, op: 0.13 }], vlines: [{ x: 0, color: INK, label: "Takeoff", label2: `${f2(R.takeoff.t)} s` }, { x: -5, color: "#8e89ad", dash: "3 3", label: "5 m out" }],
    dots, extra: topMark(R.top.dist - R.takeoff.dist, R.top.speed, `Top ${f2(R.top.speed)} m/s`),
    series: cutSeries(xs, cv.vr, cv.v, 0) });
  // step rhythm table
  const st = R.steps.times; let rows = "";
  for (let i = 0; i < st.length; i++) { const fromEnd = st.length - 1 - i, left = fromEnd % 2 === 0; const k = Math.max(0, cv.t.findIndex((x) => x >= st[i]));
    rows += `<tr><td>${i + 1}</td><td>${left ? `<b style="color:${ACC}">L${R.steps.lefts - Math.floor(fromEnd / 2)}</b>` : "R"}</td><td>${f2(st[i])} s</td><td>${i ? f2(st[i] - st[i - 1]) + " s" : "–"}</td><td>${f1(xs[k])} m</td><td>${f2(cv.v[k])}</td></tr>`; }
  const setup = SETUPS[run.setup];
  return `<div class="page"><div class="rhead"><span>LiDAR SENSOR</span><span>VAULT APPROACH REPORT</span></div>
    <div class="box btop">${brandBlock("Vault approach report<br>TF03 LiDAR · " + R.rate + " Hz")}
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:12px;flex-wrap:wrap">
      <div><div class="eyebrow">POLE VAULT · ${setup.name.toUpperCase()}</div><div class="who">${esc(a.name)}</div></div>
      <div style="color:${INK2};font-size:13px">${when} &nbsp; ${setup.detail}</div></div>
    <div class="metrics">
      <div class="m hero"><div class="k">Last 5 m into takeoff</div><div class="v">${f2(R.last5 && R.last5.speed)}<small style="font-size:18px">m/s</small></div><div class="k">${c ? c.text : ""}</div></div>
      ${m("10 → 5 m out", f2(R.prev5 && R.prev5.speed), "m/s", "", "r1")}${m("Top speed", f2(R.top.speed), "m/s", "", "r1")}${m("Lefts", R.steps.counted ? R.steps.lefts : "—", "", `${R.steps.counted} steps`, "r1")}${m("Takeoff ≈", R.takeoff.outFt != null ? ftLabel(R.takeoff.outFt) : "—", "", "out from the box", "r1")}
      ${m("Start mark ≈", R.startMarkFt != null ? ftLabel(R.startMarkFt) : "—", "", "from the box")}${m("Approach time", f2(R.approachTime), "s")}${m("33 → 16 ft out", R.box10to5 ? f2(R.box10to5.speed) : "—", "m/s")}${m("Approach distance", f1(R.approachDist), "m")}
    </div></div>
    <div class="box"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,${ACC},${ACC2},${ACC3});display:inline-block"></span><b style="font-size:14px">Summary</b><span style="color:${INK2}">· written by the app from this jump</span></div>
      <ul class="sum">${sum.bullets.map((b) => `<li>${b}</li>`).join("")}</ul><div class="next"><b>NEXT SESSION</b>${sum.next}</div></div>
    <div class="box"><h4>Speed into the takeoff</h4>${svg}${legend([[SW_LINE(ACC), "Speed"], [SW_LINE("#b6b1cc", 1.5), "Raw readings"], [`<span style="color:${ACC};font-weight:800">●</span>`, "Lefts, numbered from the start"], [`<span style="color:#b9b4d2;font-weight:800">●</span>`, "Rights"]])}</div>
    ${footer(1, 2)}</div>
    <div class="page"><div class="rhead"><span>LiDAR SENSOR</span><span>VAULT APPROACH REPORT</span></div>
    <div class="box"><h4>Step rhythm</h4>${st.length ? `<table><thead><tr><th style="text-align:left">#</th><th>Foot</th><th>Time</th><th>Step time</th><th>Before takeoff</th><th>Speed (m/s)</th></tr></thead><tbody>${rows}</tbody></table>
      <div style="color:${INK2};margin-top:8px">Steps are found from the small dip in speed at each foot contact and counted back from the takeoff (a left). Anything before the first steady step, like a hop, skip or walk-in, is left out.</div>` : `<div style="color:${INK2}">The steps weren't clear enough to count on this jump.</div>`}</div>
    ${footer(2, 2)}</div>`;
}
function openReport(id) {
  const run = runs.find((r) => r.id === id) || (cap.run && cap.run.id === id ? cap.run : null);
  if (!run) return;
  const el = $("#report");
  el.innerHTML = `<div class="bar"><button data-rep="close">‹ Close</button><button data-rep="print">Print / Save PDF</button></div>` + (run.mode === "sprint" ? sprintReport(run) : vaultReport(run));
  el.classList.remove("hidden"); el.scrollTop = 0;
  // fit the letter-size pages to the phone screen
  const fit = () => { const w = Math.min(1, (window.innerWidth - 16) / 816); el.querySelectorAll(".page").forEach((p) => { p.style.zoom = w < 1 ? w : ""; }); };
  fit(); window.addEventListener("resize", fit, { once: true });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-rep]"); if (!b) return;
  if (b.dataset.rep === "close") { $("#report").classList.add("hidden"); $("#report").innerHTML = ""; }
  if (b.dataset.rep === "print") { $("#report").querySelectorAll(".page").forEach((p) => (p.style.zoom = "")); window.print(); setTimeout(() => { const w = Math.min(1, (window.innerWidth - 16) / 816); $("#report").querySelectorAll(".page").forEach((p) => (p.style.zoom = w < 1 ? w : "")); }, 500); }
});


// ---------------- start ----------------
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
render(); poll();
})();
// ===== APP END =====

</script>
