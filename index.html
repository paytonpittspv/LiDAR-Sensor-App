/* Everything is inline: the app is served by the sensor itself and works with no internet. */
:root{
  /* the sensor screen and the big display's colours */
  --bg:#0b0915;--card:#171329;--card2:#221d3a;--text:#f4f1ff;--muted:#9c95b8;--line:#2b2546;
  --pink:#ff2d8a;--purple:#8b5cf6;--blue:#22b8ff;--good:#2bd47d;--warn:#ffb020;--bad:#ff4d6d;
  --on:#f4f1ff;--on-ink:#0b0915;--grad:linear-gradient(120deg,#ff2d8a,#8b5cf6 55%,#22b8ff);
  --tint:linear-gradient(135deg,rgba(255,45,138,.16),rgba(139,92,246,.16),rgba(34,184,255,.16));
  --tint-strong:linear-gradient(135deg,rgba(255,45,138,.32),rgba(139,92,246,.32),rgba(34,184,255,.32));
  --c1:#ff2d8a;--c2:#8b5cf6;--c3:#22b8ff;--c4:#ffb020;
  --display:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#ffffff;--card:#f6f4fd;--card2:#ece8fb;--text:#17142c;--muted:#5f5a80;--line:#dcd6f3;
  --pink:#e0147a;--purple:#7444e8;--blue:#0f8fd6;--good:#13a35f;--bad:#d62650;--on:#17142c;--on-ink:#ffffff;color-scheme:light}}
:root[data-theme="light"]{--bg:#ffffff;--card:#f6f4fd;--card2:#ece8fb;--text:#17142c;--muted:#5f5a80;--line:#dcd6f3;
  --pink:#e0147a;--purple:#7444e8;--blue:#0f8fd6;--good:#13a35f;--bad:#d62650;--on:#17142c;--on-ink:#ffffff;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
/* home-screen app on iPhone/iPad: the status bar is drawn over the page, and iPads often report no safe area for it,
   so always leave at least the status bar's height above the header */
html.ios-app .top{padding-top:calc(12px + max(env(safe-area-inset-top,0px),24px))}
/* Home Screen app on iPhone: with the see-through status bar, a page shorter than the screen leaves the bottom
   tab bar floating a status bar's height too high (an iOS quirk). Making the page at least that much taller keeps
   it pinned to the bottom on every tab, like on the long ones. */
html.ios-app{min-height:calc(100% + env(safe-area-inset-top,0px))}
/* tablets and wider: line the header up with the content column */
@media (min-width:720px){.top{padding-left:max(16px,calc((100% - 680px) / 2 + 16px));padding-right:max(16px,calc((100% - 680px) / 2 + 16px))}}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(15px,4.2vw,23px);letter-spacing:.4px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.top .pill{flex:none}
.brand .byline{font-family:var(--ui);font-weight:600;font-size:11px;letter-spacing:.3px;color:var(--muted);margin-top:3px;line-height:1.1}
.brand .lmark{display:inline-block;color:#fff;background:linear-gradient(135deg,#ff2d8a,#8b5cf6 52%,#22b8ff);border-radius:.24em;padding:.06em .32em .1em;margin-right:.3em;line-height:1;letter-spacing:.2px}
.brand b{background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good)}.pill.off{color:var(--bad)}
main{max-width:680px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1{font-family:var(--display);font-size:30px;line-height:1.05;margin:4px 0 12px;letter-spacing:.3px;text-wrap:balance}
h2{font-family:var(--display);font-size:22px;margin:22px 0 10px;letter-spacing:.3px}
h3{font-size:15px;margin:14px 0 6px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;min-width:0}
.card.tint{background:var(--tint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sessbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:12px}
.sessbar b{display:block;font-size:14px}.sessbar span{font-size:12.5px;color:var(--muted)}
.qn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:11.5px;font-weight:800;margin-right:7px}
.lm th,.lm td{white-space:nowrap;padding:6px 7px;font-size:12.5px}.lm .mid{background:var(--tint-strong)}.lm tr.avg td{font-weight:800;color:var(--text)}
.midbox{display:flex;justify-content:space-between;align-items:center;background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 8px}
.chip.sm{padding:5px 10px;font-size:12.5px}
.mapkey{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:11.5px;color:var(--muted);margin:6px 0 10px}.mapkey span{display:inline-flex;align-items:center;gap:5px}.mapkey svg{width:auto}
.wiz-top{display:flex;justify-content:space-between;align-items:center;min-height:34px;margin-top:2px}
.wiz-bar{display:flex;gap:6px;margin:8px 0 14px}.wiz-bar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wiz-bar i:nth-child(1).on{background:var(--pink)}.wiz-bar i:nth-child(2).on{background:var(--purple)}.wiz-bar i:nth-child(3).on{background:var(--blue)}
.wiz-back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;padding:8px 16px 8px 11px;border-radius:999px;
  border:1.5px solid var(--purple);background:var(--card2);color:var(--text);cursor:pointer}
.wiz-back svg{width:16px;height:16px;color:var(--purple)}.wiz-back:active{transform:scale(.97)}
.btn.ghost{background:none;border-color:transparent;padding-left:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr;gap:12px}@media (min-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px 18px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;min-height:112px}
.tile svg{width:30px;height:30px;color:var(--purple);margin-bottom:6px}.tile b{font-family:var(--display);font-size:26px;letter-spacing:.3px}.tile span{color:var(--muted);font-size:14px}
.tile[aria-pressed="true"]{border-color:var(--purple);background:linear-gradient(135deg,rgba(224,20,122,.10),rgba(116,68,232,.12),rgba(15,143,214,.10))}
.tile:active{transform:scale(.99)}
.bigchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.chip.big{font-size:20px;font-weight:700;padding:16px 0;border-radius:14px;text-align:center;justify-content:center}
.wiz-sum{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
details.howto-d{margin-top:14px}details.howto-d summary{cursor:pointer;color:var(--purple);font-weight:600;padding:6px 0}
ol.steps{margin:0;padding-left:20px}ol.steps li{margin:8px 0;font-size:14px;line-height:1.5}
.zone{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.zone i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.5}
.zone.on{color:var(--text);border-color:var(--pink)}.zone.on i{background:var(--pink);opacity:1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
@media (prefers-reduced-motion:reduce){.zone.on i{animation:none}}
.card.ready .status{background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.livebig{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}.livebig small{font-size:15px;color:var(--muted);font-weight:600}
.upname{font-family:var(--display);font-weight:800;font-size:26px;margin-bottom:2px}
.upnext{margin:4px 0 12px}.upnext .chips{margin-top:6px}
.hello{margin:4px 2px 14px}.hello .hi{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin-bottom:4px;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.qtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.qtiles .qt{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.qtiles .qt span{line-height:1.15}
.qt{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;color:var(--text);cursor:pointer;font:inherit}
.qt b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.qt span{font-size:12px;color:var(--muted)}
.rl{display:flex;flex-direction:column;padding:7px 0;border-bottom:1px solid var(--line)}.rl:last-child{border-bottom:0}.rl span{font-size:13px;color:var(--muted)}
.pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}.pr:last-child{border-bottom:0}
.pr .r{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 7px;border-radius:7px;color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple))}
.big2{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.big2 small{font-size:13px;color:var(--muted);font-weight:600}

@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}

.jbar-tick{position:absolute;left:0;right:0;height:0;border-top:1px solid color-mix(in srgb,var(--text) 18%,transparent);z-index:1}
.jbar-tick span{position:absolute;right:4px;top:-8px;font-size:11px;font-weight:700;color:var(--muted)}
.jbar-best{position:absolute;left:0;right:0;height:0;border-top:3px dashed var(--text);z-index:2}
.jbar-best span{position:absolute;left:4px;top:-18px;font-size:11px;font-weight:800;color:var(--text);white-space:nowrap}
.jbar-read{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.jbar-read .st-big{font-size:clamp(80px,30vw,170px)}
.jrank{display:grid;grid-template-columns:minmax(0,9em) 1fr 3.2em;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.jrank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.jrank .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.jrank .bar{height:10px;border-radius:5px;background:color-mix(in srgb,var(--text) 9%,transparent);overflow:hidden}.jrank .bar b{display:block;height:100%;border-radius:5px;background:color-mix(in srgb,var(--text) 34%,transparent)}
.jrank.me .bar b{background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue))}.jrank.me .nm{color:var(--purple)}
.pdot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.pcolors{display:flex;gap:8px}.pcolors button{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.pcolors button[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.pods{display:flex;flex-direction:column;gap:10px}.prow{display:flex;align-items:center;gap:10px}
.prow .pname{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.prow select{max-width:48%;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;padding:0 8px}
.jx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.jx div{background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.jx span{display:block;font-size:12px;color:var(--muted);font-family:var(--ui);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.jx b{font-size:24px;line-height:1.1;white-space:nowrap}.jx small{font-size:.55em;color:var(--muted);margin-left:2px}.jx em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:1px}
.jtab th,.jtab td{padding:8px 4px}.jtab td .small{white-space:nowrap}
.hp{width:100%;height:auto;display:block;margin-top:6px}.hp-grid{stroke:var(--line);stroke-width:1}.hp-t{font-size:11px;fill:var(--muted);font-family:var(--ui)}
.hp-ground{stroke:var(--muted);stroke-width:1.5}.hp-mat{fill:color-mix(in srgb,var(--blue) 22%,transparent);stroke:color-mix(in srgb,var(--blue) 45%,transparent)}.hp-box{fill:var(--muted);stroke:none}
.hp-run{fill:none;stroke:var(--muted);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.hp-air{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.hp-ghost{fill:none;stroke:var(--muted);stroke-width:1.6;opacity:.45;stroke-linejoin:round}
.hpkey{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.hpkey button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.hpkey button[aria-pressed="false"]{opacity:.4}.hpkey i{width:10px;height:10px;border-radius:50%;display:inline-block}
.hp-pt{fill:color-mix(in srgb,var(--text) 70%,transparent);font-weight:700;letter-spacing:.04em}
.hp-body{fill:color-mix(in srgb,var(--blue) 16%,var(--card));stroke:color-mix(in srgb,var(--blue) 60%,transparent);stroke-width:1.5;stroke-linejoin:round}

.hp-side{fill:none;stroke:color-mix(in srgb,var(--blue) 60%,transparent);stroke-width:1.5;stroke-dasharray:5 4;stroke-linejoin:round}
.hp-dot{fill:var(--bg);stroke:var(--text);stroke-width:2}.hp-pk{fill:var(--pink);stroke:var(--bg);stroke-width:2}.hp-l{font-size:12px;fill:var(--muted);font-family:var(--ui);font-weight:600}.hp-big{font-size:15px;fill:var(--text);font-weight:800}
.jump-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}.jump-two .jump-big{font-size:clamp(34px,11vw,52px)}

.jump-big small{font-size:22px;color:var(--muted);margin-left:6px}

<body>
<header class="top">
  <div class="brand"><div><span class="lmark">LiDAR</span>SENSOR</div><div class="byline">Developed by Payton Pitts</div></div>
  <span id="conn" class="pill off">No sensor</span>
</header>
<button id="bumpbar" class="bumpbar" data-act="go-level" hidden></button>
<main id="app"></main>
<nav class="tabbar" aria-label="Main">
  <button data-go="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button data-go="sessions" aria-label="Sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Sessions</button>
  <button data-go="new" class="plus" aria-label="New session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-go="analytics" aria-label="Analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analytics</button>
  <button data-go="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="report" class="hidden"></div>
<script>
// ===== ENGINE START =====
// Measurement engine for PAYTON'S LiDAR SENSOR.
// One smoothed distance line is made first; speed, splits, top speed and the takeoff all come from it.
const Engine = (() => {
  const FT = 0.3048;

  // ---------- filters ----------
  function biquadLP(fc, fs) {
    const w0 = (2 * Math.PI * fc) / fs, c = Math.cos(w0), al = Math.sin(w0) / (2 * Math.SQRT1_2);
    const a0 = 1 + al;
    return { b0: (1 - c) / 2 / a0, b1: (1 - c) / a0, b2: (1 - c) / 2 / a0, a1: (-2 * c) / a0, a2: (1 - al) / a0 };
  }
  function runBiquad(x, q) {
    const y = new Float64Array(x.length);
    let x1 = x[0], x2 = x[0], y1 = x[0], y2 = x[0];
    for (let i = 0; i < x.length; i++) {
      const v = q.b0 * x[i] + q.b1 * x1 + q.b2 * x2 - q.a1 * y1 - q.a2 * y2;
      x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v;
    }
    return y;
  }
  // zero-phase low-pass (forward + backward), with mirrored padding so the ends don't droop
  function filtfilt(x, fc, fs) {
    const n = x.length, pad = Math.min(n - 1, Math.round((3 * fs) / fc));
    const ext = new Float64Array(n + 2 * pad);
    for (let i = 0; i < pad; i++) { ext[i] = 2 * x[0] - x[pad - i]; ext[n + pad + i] = 2 * x[n - 1] - x[n - 2 - i]; }
    ext.set(x, pad);
    const q = biquadLP(fc, fs);
    let y = runBiquad(ext, q);
    y.reverse(); y = runBiquad(y, q); y.reverse();
    return y.slice(pad, pad + n);
  }
  function deriv(x, fs) {
    const n = x.length, v = new Float64Array(n);
    for (let i = 1; i < n - 1; i++) v[i] = ((x[i + 1] - x[i - 1]) * fs) / 2;
    v[0] = v[1]; v[n - 1] = v[n - 2];
    return v;
  }

  // ---------- 1) raw sensor frames → one clean, evenly spaced distance track ----------
  function track(raw, limitCm) {
    const n = raw.t.length;
    if (n < 300) return { error: "Not enough data recorded." };
    // The sensor sends frames at a fixed rate: fit time vs frame number to remove Wi-Fi/serial jitter.
    let sx = 0, sy = 0, sxx = 0, sxy = 0;
    const t0 = raw.t[0];
    for (let i = 0; i < n; i++) { const y = (raw.t[i] - t0) | 0; sx += i; sy += y; sxx += i * i; sxy += i * y; }
    const b = (n * sxy - sx * sy) / (n * sxx - sx * sx), a = (sy - b * sx) / n;
    const fs = 1e6 / b;
    const T = [], D = [];
    for (let i = 0; i < n; i++) { const cm = raw.d[i]; if (cm > 10 && cm < Math.min(raw.maxCm, limitCm || Infinity)) { T.push((a + b * i) / 1e6); D.push(cm / 100); } }
    if (T.length < 300) return { error: "The sensor didn't see the athlete for most of the run. Check the aim." };
    // Drop single bad readings (arms, the pole, background) with a running median.
    const W = 15, kt = [], kd = [];
    for (let k = 0; k < D.length; k++) {
      const lo = Math.max(0, k - W), hi = Math.min(D.length, k + W + 1);
      const win = D.slice(lo, hi).sort((p, q) => p - q), med = win[win.length >> 1];
      if (Math.abs(D[k] - med) < 0.35) { kt.push(T[k]); kd.push(D[k]); }
    }
    // Split into continuous pieces (a gap over 0.12 s = athlete lost) and keep the piece that travels furthest.
    const pieces = []; let s = 0;
    for (let k = 1; k <= kt.length; k++) if (k === kt.length || kt[k] - kt[k - 1] > 0.12) { pieces.push([s, k]); s = k; }
    let best = pieces[0], bestGain = -1;
    for (const [p0, p1] of pieces) {
      if (p1 - p0 < 50) continue;
      let mn = Infinity, mx = -Infinity; for (let k = p0; k < p1; k++) { mn = Math.min(mn, kd[k]); mx = Math.max(mx, kd[k]); }
      if (mx - mn > bestGain) { bestGain = mx - mn; best = [p0, p1]; }
    }
    // Resample that piece onto an even grid.
    const [p0, p1] = best, dt = 1 / fs;
    const m = Math.floor((kt[p1 - 1] - kt[p0]) / dt) + 1;
    const d = new Float64Array(m); let j = p0;
    for (let i = 0; i < m; i++) {
      const t = kt[p0] + i * dt;
      while (j < p1 - 2 && kt[j + 1] < t) j++;
      const f = (t - kt[j]) / ((kt[j + 1] - kt[j]) || 1e-9);
      d[i] = kd[j] + Math.max(0, Math.min(1, f)) * (kd[j + 1] - kd[j]);
    }
    return { fs, t0: kt[p0], d, lostAtEnd: p1 < kt.length || true };
  }

  // ---------- 2) smooth distance, then speed from it ----------
  const SMOOTH_HZ = 3;     // the one line: splits, speed curve and top speed all use this
  const STEP_HZ = 7;       // keeps the per-step speed wobble, only used to find foot contacts
  const RAW_HZ = 12;
  const STRIDE_S = 0.46;
  let SHARPEN = false, REPAIR = true, FLIGHT_DROP = 0.05, FLIGHT_LAG = 0.045;   // one stride (two steps) for the speed curve and top speed       // "raw speed" line drawn on charts
  function lines(tr) {
    const ds = filtfilt(tr.d, SMOOTH_HZ, tr.fs);
    const v = deriv(ds, tr.fs);
    const vStep = deriv(filtfilt(tr.d, STEP_HZ, tr.fs), tr.fs);
    const vRaw = deriv(filtfilt(tr.d, RAW_HZ, tr.fs), tr.fs);
    // stride speed: distance covered over one stride (~0.46 s, two steps) of the same smoothed line,
    // so the curve shows the run, not the small speed-up/slow-down inside every step
    const h = Math.round(STRIDE_S / 2 * tr.fs), n = ds.length, vStride = new Float64Array(n);
    for (let k = 0; k < n; k++) { const a = Math.max(0, k - h), b = Math.min(n - 1, k + h); vStride[k] = b > a ? (ds[b] - ds[a]) / ((b - a) / tr.fs) : v[k]; }
    return { d: tr.d, ds, v, vStep, vRaw, vStride };
  }

  // time when the smoothed distance first reaches x (searching from index k0)
  function crossTime(ds, fs, k0, x) {
    if (ds[k0] >= x) return k0 / fs;
    for (let k = k0 + 1; k < ds.length; k++) if (ds[k] >= x) { const f = (x - ds[k - 1]) / ((ds[k] - ds[k - 1]) || 1e-9); return (k - 1 + f) / fs; }
    return NaN;
  }

  // ---------- 3) foot contacts and lefts ----------
  // Each foot contact slows the trunk a little, then the push speeds it up again: one wobble in speed per step.
  // We take that wobble (step-speed minus smoothed speed), keep only step-like frequencies (1.8–6.5 Hz), and
  // follow its phase: one full turn = one step, a contact sits at the bottom of each turn. Counting turns is
  // much steadier than hunting for individual dips. Then we walk back from the takeoff (a left) and stop at
  // the first step that breaks the rhythm, so hops, skips and walk-ins aren't counted.
  function fft(re, im, inv) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = ((inv ? 2 : -2) * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const ar = re[i + k], ai = im[i + k], br = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, bi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
          re[i + k] = ar + br; im[i + k] = ai + bi; re[i + k + len / 2] = ar - br; im[i + k + len / 2] = ai - bi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
    if (inv) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
  }
  function stepPhase(L, fs, kFrom, kTo) {
    const dec = Math.max(1, Math.round(fs / 200)), f2 = fs / dec;
    const m = Math.floor((kTo - kFrom) / dec) + 1;
    let N = 1; while (N < m * 2) N <<= 1;
    const re = new Float64Array(N), im = new Float64Array(N);
    // use the distance wobble (raw distance minus the smooth line): less noisy than a speed wobble
    for (let i = 0; i < m; i++) { const k = kFrom + i * dec; let a = 0; for (let q = 0; q < dec; q++) a += L.d[Math.min(L.d.length - 1, k + q)] - L.ds[Math.min(L.d.length - 1, k + q)]; re[i] = a / dec / Math.max(1, L.v[k]); }
    // taper the ends a little
    const tap = Math.min(m >> 3, Math.round(0.2 * f2));
    for (let i = 0; i < tap; i++) { const w = 0.5 - 0.5 * Math.cos((Math.PI * i) / tap); re[i] *= w; re[m - 1 - i] *= w; }
    fft(re, im, false);
    for (let i = 0; i < N; i++) {
      const f = i <= N / 2 ? (i * f2) / N : -((N - i) * f2) / N;
      if (f < 1.8 || f > 6.5) { re[i] = 0; im[i] = 0; } else { re[i] *= 2; im[i] *= 2; }   // analytic, band-limited
    }
    fft(re, im, true);
    const ph = new Float64Array(m), amp = new Float64Array(m);
    let prev = 0, off = 0;
    for (let i = 0; i < m; i++) {
      let p = Math.atan2(im[i], re[i]) + Math.PI / 2;   // speed wobble leads the distance wobble by a quarter turn
      if (i) { while (p + off - prev > Math.PI) off -= 2 * Math.PI; while (p + off - prev < -Math.PI) off += 2 * Math.PI; }
      ph[i] = p + off; prev = ph[i]; amp[i] = Math.hypot(re[i], im[i]);
    }
    return { ph, amp, dec, f2, kFrom, m };
  }
  // contacts = where the phase passes the bottom of the wobble (π, 3π, ...)
  function contactsFromPhase(S, L) {
    let out = [];
    // phase only moves forward (stops wobbles around a crossing from counting twice)
    const mono = new Float64Array(S.m); mono[0] = S.ph[0];
    for (let i = 1; i < S.m; i++) mono[i] = Math.max(mono[i - 1], S.ph[i]);
    for (let i = 1; i < S.m; i++) {
      const a = mono[i - 1], b = mono[i];
      const na = Math.floor((a - Math.PI) / (2 * Math.PI)), nb = Math.floor((b - Math.PI) / (2 * Math.PI));
      if (nb > na) { const target = Math.PI + 2 * Math.PI * nb; const f = (target - a) / ((b - a) || 1e-9); out.push(S.kFrom + (i - 1 + f) * S.dec); }
    }
    out = out.map((k) => Math.round(k));
    // merge contacts that are far closer together than the steps around them (a phase slip, not a step)
    const fsx = S.f2 * S.dec;
    let changed = true;
    while (changed && out.length > 3) {
      changed = false;
      for (let i = 1; i < out.length; i++) {
        const lo = Math.max(1, i - 3), hi = Math.min(out.length - 1, i + 3), ivs = [];
        for (let j = lo; j <= hi; j++) if (j !== i) ivs.push(out[j] - out[j - 1]);
        const med = ivs.sort((a, b) => a - b)[ivs.length >> 1] || 0;
        if (out[i] - out[i - 1] < 0.62 * med && out[i] - out[i - 1] < 0.2 * fsx) { out.splice(i, 1, Math.round((out[i] + out[i - 1]) / 2)); out.splice(i - 1, 1); changed = true; break; }
      }
    }
    return out;
  }
  // pole run off the runway: no box, so no plant. The takeoff shows up as the step rhythm stopping
  // (in the air there are no foot contacts). Find the first contact after which the wobble dies away
  // for most of a stride, once the athlete is near top speed; that contact is the takeoff.
  function flightTakeoff(L, fs, kGo, kTopAll, n) {
    // The takeoff step turns forward speed into lift: speed drops ~10% over that one contact, then holds
    // steady in the air (no feet, no push) until the landing. Find the first drop after top speed that is
    // followed by that steady stretch; the takeoff contact is just before the drop shows.
    const win = Math.round(0.5 * fs), air = Math.round(0.25 * fs);
    for (let k = kTopAll; k < n - air; k++) {
      let mx = 0; for (let q = Math.max(0, k - win); q <= k; q += 5) mx = Math.max(mx, L.v[q]);
      if (L.vStep[k] >= (1 - FLIGHT_DROP) * mx) continue;
      // steady after: over the next 0.25 s the speed changes by less than half the drop again
      const v0 = L.v[k + Math.round(0.05 * fs)], v1 = L.v[k + air];
      if (Math.abs(v1 - v0) < 0.5 * FLIGHT_DROP * mx) return k - Math.round(FLIGHT_LAG * fs);
    }
    return null;
  }
  // kAnchor = where we expect the last contact (the takeoff for vault)
  function trackSteps(L, fs, kGo, kEnd, kAnchor) {
    const kFrom = Math.max(0, kGo - Math.round(0.6 * fs)), kTo = Math.min(L.v.length - 1, kEnd + Math.round(0.2 * fs));
    const S = stepPhase(L, fs, kFrom, kTo);
    const contacts = contactsFromPhase(S, L);
    // takeoff / last step: carry the rhythm of the steady steps just before the plant forward to it,
    // then use the contact that sits there (or the predicted spot if the plant blurred that dip)
    let lastIdx = -1;
    // (the plant bends the last ~0.3 s of the wobble, so only trust contacts before that)
    const before = contacts.filter((k) => k < kAnchor - 0.3 * fs);
    if (before.length >= 4) {
      const iv = []; for (let i = before.length - 4; i < before.length; i++) iv.push(before[i] - before[i - 1]);
      const Im = iv.sort((a, b) => a - b)[iv.length >> 1];
      let cur = before[before.length - 1];
      const chain = before.slice();
      while (cur + 0.5 * Im <= kAnchor + 0.06 * fs) {
        const pred = cur + Im;
        const snap = contacts.filter((k) => Math.abs(k - pred) <= 0.3 * Im).sort((a, b) => Math.abs(a - pred) - Math.abs(b - pred))[0];
        cur = snap != null ? snap : Math.round(pred); chain.push(cur);
      }
      contacts.splice(0, contacts.length, ...chain);
      lastIdx = contacts.length - 1;
    } else {
      let bestD = 0.12 * fs;
      contacts.forEach((k, i) => { const d = Math.abs(k - kAnchor); if (d <= bestD) { bestD = d; lastIdx = i; } });
    }
    if (lastIdx < 0) return [];
    // typical wobble size during the run, to spot where the rhythm fades out
    const ampAt = (k) => S.amp[Math.max(0, Math.min(S.m - 1, Math.round((k - S.kFrom) / S.dec)))];
    // (skip the last two steps: the plant makes the wobble there look bigger than it is)
    const amps = contacts.slice(Math.max(0, lastIdx - 10), Math.max(1, lastIdx - 1)).map(ampAt).sort((a, b) => a - b);
    const refAmp = amps[amps.length >> 1] || 0;
    const out = [contacts[lastIdx]];
    let guesses = 0;
    for (let i = lastIdx - 1; i >= 0; i--) {
      const last = out[out.length - 1], k = contacts[i], dt = (last - k) / fs;
      // reference = median of the last three step times we accepted (one noisy step won't break the count)
      const recent = []; for (let j = Math.max(1, out.length - 3); j < out.length; j++) recent.push((out[j - 1] - out[j]) / fs);
      const ref = recent.length ? recent.sort((a, b) => a - b)[recent.length >> 1] : dt;
      if (L.v[k] < 1.5) break;                                            // before the run started
      if (out.length > 1 && dt < ref * 0.6) continue;                     // a stray contact between two steps: skip it
      if (dt < 0.17) continue;
      if (out.length > 1 && dt >= ref * 1.7 && dt <= ref * 2.3 && L.v[k] > 4 && guesses < 2) {
        out.push(Math.round((last + k) / 2)); guesses++;                  // one dip missed inside a steady rhythm
      } else if (dt > 0.5 || (out.length > 1 && dt > ref * 1.8)) break;  // rhythm breaks (hop, skip, walk-in)
      // wobble gone for two steps in a row: no real steps here
      if (ampAt(k) < 0.2 * refAmp && i > 0 && ampAt(contacts[i - 1]) < 0.2 * refAmp) break;
      out.push(k);
    }
    return out.reverse();
  }

  // ---------- 4) force–velocity profile (simple model, no air resistance) ----------
  function fvProfile(L, fs, kGo, kTop, mass) {
    // fit v(t) = vmax * (1 - e^(-t/tau)) to the smoothed speed from the start to top speed
    let best = null;
    const n = kTop - kGo; if (n < fs * 0.8) return null;
    const stepK = Math.max(1, Math.round(fs / 100));
    for (let tau = 0.5; tau <= 2.5; tau += 0.005) {
      let sxy = 0, sxx = 0;
      for (let k = kGo; k <= kTop; k += stepK) { const x = 1 - Math.exp(-((k - kGo) / fs) / tau); sxy += x * L.v[k]; sxx += x * x; }
      const vmax = sxy / sxx; let err = 0;
      for (let k = kGo; k <= kTop; k += stepK) { const e = L.v[k] - vmax * (1 - Math.exp(-((k - kGo) / fs) / tau)); err += e * e; }
      if (!best || err < best.err) best = { tau, vmax, err };
    }
    const { tau, vmax } = best, F0 = vmax / tau, P0 = (F0 * vmax) / 4, slope = -F0 / vmax;
    // model curves for power and force over the run
    let pk = 0, sumP = 0, sumF = 0, c = 0;
    const T = (kTop - kGo) / fs;
    for (let t = 0; t <= T; t += 0.01) { const a = (vmax / tau) * Math.exp(-t / tau), v = vmax * (1 - Math.exp(-t / tau)); const p = a * v; pk = Math.max(pk, p); sumP += p; sumF += a; c++; }
    return { tau, V0: vmax, F0, P0, slope, peakPowerKg: pk, meanPowerKg: sumP / c, meanForceKg: sumF / c,
      F0abs: mass ? F0 * mass : null, P0abs: mass ? P0 * mass : null, peakPower: mass ? pk * mass : null, meanPower: mass ? (sumP / c) * mass : null, meanForce: mass ? (sumF / c) * mass : null };
  }

  // ---------- main ----------
  // ctx: { mode: "sprint", target: m } | { mode: "vault", setup: "runway100" | "runway150" | "polerun100" | "polerun150" }, mass (kg, optional)
  function process(raw, ctx) {
    // vault: the tripod is 100 or 150 ft from the box (on the runway) or from the box mark (pole runs);
    // every distance is measured from there and nothing past it is used. (noBox: only for lining up simulations)
    const boxM = ctx.mode === "vault" && !ctx.noBox ? (/150$/.test(ctx.setup || "") ? 150 : 100) * FT : null;
    const tr = track(raw, boxM ? Math.round(boxM * 100) : null); if (tr.error) return tr;

    let kTopAll = 0; for (let k = 0; k < n; k++) if (L.v[k] > L.v[kTopAll]) kTopAll = k;
    if (L.v[kTopAll] < 2) return { error: "No run found in this recording." };

    if (raw.t && raw.t.length) res.us0 = (raw.t[0] + Math.round((tr.t0 + tGo) * 1e6)) >>> 0;

    // ----- where the run ends -----
    let kEnd = n - 1;
    if (ctx.mode === "sprint") {
      const tf = crossTime(L.ds, fs, kGo, dGo + ctx.target);
      if (!isFinite(tf)) return { error: `The run didn't reach ${ctx.target} m. Check the target distance or the aim.` };
      kEnd = Math.min(n - 1, Math.ceil(tf * fs));

      for (let k = kTopAll + 1; k < n; k++) if (L.v[k] < 0.75 * L.v[kTopAll]) { kEnd = k; break; }

    // top speed within the run
    // top speed = fastest stride, so a single step or a noisy reading can't set it
    let kTop = kGo; for (let k = kGo; k <= kEnd; k++) if (L.vStride[k] > L.vStride[kTop]) kTop = k;
    res.top = { speed: L.vStride[kTop], t: kTop / fs - tGo, dist: L.ds[kTop] - dGo };

    // ----- steps -----
    // vault / pole run: count back from the takeoff (the plant shows up as a sudden ~10% drop in speed,
    // about 0.045 s after the takeoff contact); sprint: from the last contact before the finish
    let kAnchor = kEnd;
    const poleRun = ctx.mode === "vault" && /^polerun/.test(ctx.setup || "");
    if (poleRun) { const k = flightTakeoff(L, fs, kGo, kTopAll, n); if (k != null) { kAnchor = k; kEnd = Math.max(kEnd, k + Math.round(0.2 * fs)); } }
    else if (ctx.mode === "vault") {

        if (L.vStep[k] < 0.9 * mx) { kAnchor = k - Math.round(0.045 * fs); break; }

      // and the last step is the takeoff itself
      const tol = Math.round(0.06 * fs);
      stepKs = stepKs.filter((k) => k <= kAnchor + tol);
      const last = stepKs[stepKs.length - 1];
      if (last != null && Math.abs(last - kAnchor) <= tol) stepKs[stepKs.length - 1] = kAnchor;

    if (ctx.mode === "sprint") {
      const T = ctx.target;
      res.time = at(T);
      res.avgSpeed = T / res.time;
      res.splits = [];
      for (let x = 5; x <= T + 1e-9; x += 5) { const t1 = at(x), t0 = x === 5 ? 0 : at(x - 5); res.splits.push({ from: x - 5, to: x, time: t1 - t0, at: t1, speed: 5 / (t1 - t0) }); }
      res.cum = {}; for (const x of [10, 20, 30, 40, 50, 60]) if (x <= T) res.cum[x] = at(x);
      // best flying 10 m inside the test distance

      if (T >= 10) for (let x = 0; x + 10 <= T + 1e-9; x += 0.05) { const dt = at(x + 10) - at(x); if (isFinite(dt) && (!fly || dt < fly.time)) fly = { from: x, to: x + 10, time: dt, speed: 10 / dt }; }
      res.fly10 = fly;
      // acceleration
      let aPk = 0, aPkRaw = 0; for (let k = kGo; k <= kTop; k++) { aPk = Math.max(aPk, (L.v[Math.min(n - 1, k + 1)] - L.v[Math.max(0, k - 1)]) * fs / 2); }
      for (let k = kGo; k <= kTop; k++) aPkRaw = Math.max(aPkRaw, (L.vRaw[Math.min(n - 1, k + 1)] - L.vRaw[Math.max(0, k - 1)]) * fs / 2);
      res.accel = { peak: aPk, peakRaw: aPkRaw, mean: res.top.speed / Math.max(0.1, res.top.t) };
      res.fv = fvProfile(L, fs, kGo, kTop, ctx.mass);
      // stride at top speed: steps per second and metres per step, from a straight-line fit through
      // every step from 5 m before the fastest 10 m to the finish (one jittery contact can't skew it)
      if (fly) {

        if (ks.length >= 6) {
          const N = ks.length, mi = (N - 1) / 2, mt = ks.reduce((s, k) => s + k, 0) / N / fs;
          let sxy = 0, sxx = 0; ks.forEach((k, i) => { sxy += (i - mi) * (k / fs - mt); sxx += (i - mi) ** 2; });
          const stepT = sxy / sxx, freq = 1 / stepT;
          const sp = (L.ds[ks[N - 1]] - L.ds[ks[0]]) / ((ks[N - 1] - ks[0]) / fs);

        }
      }

      res.reach = {};
      for (const p of [0.9, 0.95, 0.98]) { for (let k = kGo; k <= kTop; k++) if (L.vStride[k] >= p * res.top.speed) { res.reach[Math.round(p * 100)] = L.ds[k] - dGo; break; } }
    } else {

      const kTo = takeoffK != null ? takeoffK : kEnd;
      const dTo = L.ds[kTo];
      const seg = (a, b) => { const ta = crossTime(L.ds, fs, kGo, a), tb = crossTime(L.ds, fs, kGo, b); return isFinite(ta) && isFinite(tb) && tb > ta ? { time: tb - ta, speed: (b - a) / (tb - ta) } : null; };
      res.takeoff = { t: kTo / fs - tGo, dist: dTo - dGo, sensor: dTo, fromSteps: takeoffK != null };
      // stride speed must not reach past the takeoff (the plant slows the body, not the run-up)
      const h = Math.round(STRIDE_S / 2 * fs);
      for (let k = Math.max(0, kTo - h); k < n; k++) { const a = Math.max(0, Math.min(k, kTo) - h), b = Math.min(kTo, k + h); L.vStride[k] = b > a ? (L.ds[b] - L.ds[a]) / ((b - a) / fs) : L.v[k]; }
      let kT2 = kGo; for (let k = kGo; k <= kTo; k++) if (L.vStride[k] > L.vStride[kT2]) kT2 = k;
      res.top = { speed: L.vStride[kT2], t: kT2 / fs - tGo, dist: L.ds[kT2] - dGo };
      res.fv = fvProfile(L, fs, kGo, kT2, ctx.mass);   // power from the run-up (same model as sprint)
      // into the box: speed over the last 0.25 s before the plant vs the 0.25 s half a second earlier
      // (ends 0.05 s before the takeoff contact so the plant itself doesn't leak in)
      const win = (kb, len) => { const ka = Math.max(kGo, kb - Math.round(len * fs)); return kb > ka ? (L.ds[kb] - L.ds[ka]) / ((kb - ka) / fs) : null; };
      const ke = kTo - Math.round(0.05 * fs), vEnd = win(ke, 0.25), vBefore = win(ke - Math.round(0.5 * fs), 0.25);
      res.finish = vEnd != null && vBefore != null ? { vEnd, vBefore, change: vEnd - vBefore, accel: (vEnd - vBefore) / 0.5 } : null;
      // every contact: where it landed, in feet from the box (runway) or from the start (pole runs)
      const LEAD_STEP = 0.4, LEAD_TO = 0.5, nC = stepKs.length;
      // sharpen each contact to the bottom of its speed dip (12 Hz speed line, ±0.08 s around the step estimate)
      const sharpen = (k0) => {
        const w = Math.round(0.08 * fs), a = Math.max(1, Math.round(k0) - w), b = Math.min(n - 2, Math.round(k0) + w);
        let m = a; for (let q = a; q <= b; q++) if (L.vRaw[q] < L.vRaw[m]) m = q;
        if (m <= a || m >= b) return k0;   // no clear dip: keep the estimate
        const y0 = L.vRaw[m - 1], y1 = L.vRaw[m], y2 = L.vRaw[m + 1], den = y0 - 2 * y1 + y2;
        return m + (den > 0 ? 0.5 * (y0 - y2) / den : 0);
      };

      // two neighbours on each side, move it onto that line (real step-to-step changes are smaller than this)
      const kc = stepKs.map((k) => (SHARPEN ? sharpen(k) : k));

          xs.forEach((x, j) => { S1 += x; S2 += x * x; S3 += x ** 3; S4 += x ** 4; T0 += ys[j]; T1 += x * ys[j]; T2 += x * x * ys[j]; });

          boxFt: boxM ? +((boxM - (L.ds[k] + lead)) / FT).toFixed(2) : null, startFt: +((L.ds[k] - dGo + lead) / FT).toFixed(2), v: +L.vStride[k].toFixed(3) };
      });

      res.prev5 = dTo - 10 >= dGo ? seg(dTo - 10, dTo - 5) : null;
      res.approachTime = kTo / fs - tGo;
      res.approachDist = dTo - dGo;
      if (boxM) {
        const box = boxM;
        const LEAD = 0.5;   // takeoff foot is roughly this far ahead of the lower back the laser sees
        res.box = box;
        res.takeoff.outFt = (box - (dTo + LEAD)) / FT;
        res.startMarkFt = (box - (dGo + 0.3)) / FT;

    // ----- curves to keep (50 points per second) -----
    const every = Math.max(1, Math.round(fs / 50)), kLast = Math.min(n - 1, kEnd + Math.round(0.25 * fs));
    const curve = { t: [], d: [], v: [], vr: [] };
    for (let k = Math.max(0, kGo - Math.round(0.2 * fs)); k <= kLast; k += every) {
      curve.t.push(+(k / fs - tGo).toFixed(3)); curve.d.push(+(L.ds[k] - dGo).toFixed(3));
      curve.v.push(+L.vStride[k].toFixed(3)); curve.vr.push(+L.vRaw[k].toFixed(3));
    }
    res.curve = curve;
    res.rate = Math.round(fs);
    return res;
  }

  // ---------- simulated runs (demo + tests) ----------
  // A runner with per-step speed dips. opts: { vmax, tau, back (tripod behind start, m), target (m, sprint)
  //   or steps (vault: number of run-up steps, last = takeoff), hop (true = hop/skip before the run), seed, noise }
  function simulate(o) {

    // the athlete stays in the beam, then lands and jogs out
    const land = o.popup && vaultEnd != null ? vaultEnd + (o.flight || 0.55) : null;

        // the takeoff step turns some forward speed into lift (~10% lost over the contact), the air is steady,
        // and the landing brakes before a jog-out

        const vAir = vTo * (1 - loss);

      else if (land != null && tm > vaultEnd && tm < land && rnd() < 0.15) cm = 0;   // pop-up: hips rise, a few readings miss
      else { let meas = o.back + x + gauss() * o.noise; if (rnd() < 0.005) meas -= 1 + rnd() * 2; cm = Math.max(20, Math.round(meas * 100)); }

// ---------------- compare ----------------
let compareSel = [];
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];

function toggleCompare(id) {

function compareX(run) {

      let at = null; for (let x = 5; x <= T; x += 5) if (tAt(list[i], x) - tAt(list[best], x) > 0.05) { at = x; break; }
      let worst = null, wd = 0; for (let x = 5; x <= T; x += 5) { const dd = (tAt(list[i], x) - tAt(list[i], x - 5)) - (tAt(list[best], x) - tAt(list[best], x - 5)); if (dd > wd) { wd = dd; worst = x; } }
      if (at != null) out.push(`${label(i)} fell more than 0.05 s behind by <b>${at} m</b>; the most time went in the <b>${worst - 5}–${worst} m</b> split (${f2(wd)} s).`);
    }
    const tops = list.map((r) => r.res.top.speed), tb = tops.indexOf(Math.max(...tops));
    out.push(`Highest top speed: <b>${label(tb)} ${f2(tops[tb])} m/s</b>` + (list.length > 1 ? `, ${f2(tops[tb] - Math.min(...tops))} m/s above the lowest.` : "."));

    const lefts = list.map((r) => r.res.steps.lefts);
    if (new Set(lefts).size > 1) out.push(`Lefts differ: ${list.map((r, i) => `${names[i]} ${lefts[i] || "?"}`).join(", ")}.`);
    const tos = list.map((r) => r.res.takeoff.outFt).filter((x) => x != null);
    if (tos.length > 1) out.push(`Takeoff spots spread over <b>${ftLabel(Math.max(...tos) - Math.min(...tos))}</b> (${list.map((r, i) => `${names[i]} ${ftLabel(r.res.takeoff.outFt)}`).join(", ")}).`);
    list.forEach((r, i) => { const c = changeTag(r.res); if (c && c.cls === "down") out.push(`${label(i)}: ${c.text.toLowerCase()}.`); });
  } else out.push("These runs are different tests, so only the curves are shown side by side.");

}
function compareHTML() {

    xfmt: (t) => (allVault ? `${Math.abs(t)}` : `${t}`), vlines: allVault ? [{ x: -5, label: "5 m out" }] : [],
    fmtPill: (x, vals) => vals.map((v, i) => (isFinite(v) ? `${String.fromCharCode(65 + i)} ${f2(v)}` : "")).filter(Boolean).join("  ") + ` · ${f1(Math.abs(x))} m`,

  h += `<div class="card"><div class="chips" style="margin-bottom:8px">${list.map((r, i) => `<span class="chip" style="cursor:default"><span class="dot" style="background:${COLORS[i]}"></span>${String.fromCharCode(65 + i)} · ${esc(athleteById(r.athleteId).name)} · ${testShort(testKey(r))} · ${dayLabel(dayKey(r.ts))}</span>`).join("")}</div>
    ${chart}<div class="small muted" style="margin-top:6px">${allVault ? "Lined up at the takeoff, so different start marks still compare." : "Distance from the start."} Drag across the chart to read each run's speed.</div></div>`;
  h += `<div class="card"><div class="label">What's different</div><ul class="bullets">${compareText(list).map((t) => `<li>${t}</li>`).join("")}</ul></div>`;
  // table

    ? [["Time", (r) => `${f2(r.res.time)} s`], ["Top speed", (r) => `${f2(r.res.top.speed)}`], ["Flying 10 m", (r) => (r.res.fly10 ? `${f2(r.res.fly10.time)} s` : "—")],
       ...[5, 10, 15, 20, 25, 30, 40, 50, 60].filter((x) => list.some((r) => r.target >= x)).map((x) => [`0–${x} m`, (r) => (r.target >= x ? `${f2(x === r.target ? r.res.time : interpAt(r.res.curve.d, r.res.curve.t, x))}` : "—")])]
    : [["Last 5 m", (r) => f2(r.res.last5 && r.res.last5.speed)], ["10 → 5 m out", (r) => f2(r.res.prev5 && r.res.prev5.speed)], ["Top speed", (r) => f2(r.res.top.speed)], ["Lefts", (r) => r.res.steps.lefts || "—"],

  h += `<div class="card tw"><table><thead><tr><th></th>${list.map((r, i) => `<th style="color:${COLORS[i]}">${String.fromCharCode(65 + i)}</th>`).join("")}</tr></thead><tbody>`;

// ---------------- level & aim (the BMI160 tilt sensor in the case) ----------------
// The sensor reads its tilt 100 times a second. This page shows it as a level, works out where the beam is down

const lv = { j: null, sig: "", busy: false };

    const r = await fetch(url, body ? { method: "POST", body: new URLSearchParams(body), cache: "no-store", signal: ctl.signal } : { cache: "no-store", signal: ctl.signal });
    return await r.json();

}
function lvLoop() {
  if (view !== "level") return;
  if (!lv.busy && sensor.connected && !cap.sim) {
    lvFetch().then((j) => {
      if (j) { lv.j = j; const sig = [j.ok, j.zeroed, j.half, j.front, j.ref, j.bump].join(); if (sig !== lv.sig) { lv.sig = sig; if (view === "level") render(); } else lvPaint(); }
    }).finally(() => setTimeout(lvLoop, 250));
  } else setTimeout(lvLoop, 500);
}
async function lvDo(what) {
  if (lv.busy) return; lv.busy = true;
  const j = await lvFetch({ do: what });
  lv.busy = false;
  if (!j) { toast("Couldn't reach the sensor."); return; }
  lv.j = j; lv.sig = ""; if (j.msg) toast(j.msg); render();
}

    <rect x="${x(0)}" y="${y(back + band)}" width="${x(D) - x(0)}" height="${y(back - band) - y(back + band)}" rx="4" fill="var(--good)" opacity=".16"/>
    <line x1="${x(0)}" x2="${x(D)}" y1="${y(back)}" y2="${y(back)}" stroke="var(--good)" stroke-dasharray="4 4" stroke-width="1.5" opacity=".7"/>

    <line id="lvBeam" x1="${x(0)}" y1="${y(h0)}" x2="${x(D)}" y2="${y(Math.max(0, Math.min(top, hEnd)))}" stroke="var(--pink)" stroke-width="3" stroke-linecap="round"/>

  const who = (pod.air && pod.air.who) || cap.athleteId, mine = jumps.filter((j) => j.athleteId === who && dayKey(j.ts) === dayKey(Date.now()));
  const best = mine.reduce((b, j) => Math.max(b, j.h), 0), peak = pod.air ? (pod.air.v * pod.air.v) / (2 * PodEngine.G) : 0;
  return { best, top: Math.max(0.7, Math.ceil((Math.max(best, peak) * 1.2) * 10) / 10) };
}
function airBarHTML() {
  const { best, top } = airScale(), pct = (m) => `${Math.min(100, (100 * m) / top).toFixed(1)}%`;
  let ticks = ""; for (let c = 10; c < top * 100; c += 10) ticks += `<div class="jbar-tick" style="bottom:${pct(c / 100)}"><span>${c}</span></div>`;
  return `<div class="jbar-wrap"><div class="jbar">${ticks}<div class="jbar-fill" id="jbFill"></div>${best ? `<div class="jbar-best" style="bottom:${pct(best)}"><span>best ${fmtJump(best)}</span></div>` : ""}</div>
    <div class="jbar-read"><div class="st-label">Height</div><div class="st-big"><span id="jbVal">0</span><small>cm</small></div><div class="st-ev" id="jbNote">live from the takeoff speed</div></div></div>`;
}
function airTick() {
  if (airTick.on) return; airTick.on = true;
  const f = () => {
    const A = pod.air;
    if (!A || view !== "jump") { airTick.on = false; return; }
    const G = PodEngine.G, t = (performance.now() - A.t0) / 1000, tp = A.v / G, peak = (A.v * A.v) / (2 * G);
    const hNow = t >= tp ? peak : Math.max(0, A.v * t - (G * t * t) / 2);
    const fill = $("#jbFill"), val = $("#jbVal"), { top } = airScale();
    if (fill) fill.style.height = `${Math.min(100, (100 * hNow) / top)}%`;
    if (val) val.textContent = (hNow * 100).toFixed(0);
    if (t >= tp) { const n = $("#jbNote"); if (n) n.textContent = "peak · exact number in a second"; }
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}
// no pod: a simulated jump through the same math (PodSim makes what the pod's chip would read)
function jumpSim() {
  if (pod.simPh != null || !cap.athleteId) return;
  pod.show = null;
  const rec = PodSim.simJump(0.3 + 0.35 * Math.random()).rec, R = PodEngine.analyzeJump(rec);
  const flight = R.ok ? R.flightTime * 1000 : 560, steps = [[1, 1100], [2, flight], [3, 1000], [4, 500]];
  let i = 0;
  const next = () => {
    if (i < steps.length) {
      pod.simPh = steps[i][0];
      if (pod.simPh === 2) pod.air = R.ok ? { v: R.takeoffSpeed, t0: performance.now(), who: cap.athleteId } : null;
      render(); if (pod.simPh === 2 && pod.air) airTick();
      setTimeout(next, steps[i++][1]); return;
    }
    pod.simPh = null; pod.air = null;
    podJump(rec, true);
  };
  next();
}

// ---------------- home: greeting and quick recaps (the full lists live in Sessions and Analytics) ----------------
function greeting() {
  const d = new Date(), hr = d.getHours();
  const sets = hr < 5 ? [["Rest is training too.", "Late one. Recover well and come back fast."], ["Welcome back!", "Your numbers are waiting."]]
    : hr < 11 ? [["Good morning!", "Fresh legs, fast runs."], ["Time to record some speed!", "Set up the tripod and let's go."], ["Early reps count.", "One step closer to a new best."]]
    : hr < 17 ? [["Welcome back!", "Ready for today's session?"], ["Time to record some speed!", "Every run gets you closer."], ["One step closer…", "to your fastest approach yet."]]
    : hr < 22 ? [["Evening session?", "Let's see what the legs have left."], ["One step closer…", "to your fastest approach yet."], ["Welcome back!", "Here's where things stand."]]
    : [["Welcome back!", "Here's how today went."], ["Rest up.", "Speed is built in recovery too."]];
  // the same line for the whole hour, so it doesn't change every time the screen redraws
  const seed = d.getFullYear() * 1e4 + (d.getMonth() + 1) * 100 + d.getDate() + hr * 7;
  return sets[seed % sets.length];
}
// every time an athlete beat their own best (not counting their first run)
function prEvents() {
  const asc = runs.slice().sort((a, b) => a.ts - b.ts), best = {}, ev = [];
  const metrics = [
    ["Top speed", (r) => r.mode === "sprint" && r.res.top && r.res.top.speed, "high", (v) => `${f2(v)} m/s`],
    ["Flying 10 m", (r) => r.mode === "sprint" && r.res.fly10 && r.res.fly10.time, "low", (v) => `${f2(v)} s`],
    ["Last 5 m into takeoff", (r) => r.mode === "vault" && r.res.last5 && r.res.last5.speed, "high", (v) => `${f2(v)} m/s`],
  ];
  for (const r of asc) for (const [name, pick, better, fmt] of metrics) {
    const v = pick(r); if (!v || !isFinite(v)) continue;
    const k = r.athleteId + name, b = best[k];
    if (b == null) { best[k] = v; continue; }
    if (better === "low" ? v < b : v > b) { ev.push({ r, name, text: fmt(v), gain: better === "low" ? `−${f2(b - v)} s` : `+${f2(v - b)} m/s` }); best[k] = v; }
  }
  return ev.reverse();
}

  return h;
}

    ${sTop ? statRow("Carried from sprint top speed", `${Math.round((avgOf(L5) / sTop.v) * 100)}%`, `average last 5 m ÷ best sprint top speed (${f2(sTop.v)} m/s)`) : statRow("Carried from sprint top speed", "—", "save a sprint test to see this")}

    ${SM.length ? statRow("Start mark", ftLabel(avgOf(SM)), SM.length > 1 ? `average · spread ${spreadFt(sdOf(SM))}` : "") : ""}

}

function compareAthletesCard(test) {
  const isSprint = test.startsWith("sprint"), km = keyMetric(test);
  const withRuns = athletes.filter((a) => runs.some((r) => r.athleteId === a.id && testKey(r) === test));
  if (withRuns.length < 2) return `<div class="card"><div class="label">Compare athletes · ${testName(test)}</div><div class="small muted" style="margin-top:6px">Only one athlete has ${testName(test)} runs so far. Add another athlete's runs to compare.</div></div>`;
  if (!anState.cmp) anState.cmp = withRuns.slice(0, 4).map((a) => a.id);
  const sel = anState.cmp.filter((id) => withRuns.some((a) => a.id === id));
  // one row per athlete with this test
  const rows = withRuns.map((a) => {
    const tr = runs.filter((r) => r.athleteId === a.id && testKey(r) === test);
    const best = bestOf(tr, km.pick, "high"), sTop = sprintTopFor(a.id), last = tr.reduce((p, q) => (q.ts > p.ts ? q : p));
    const o = { a, n: tr.length, best, last };
    if (isSprint) { o.fly = bestOf(tr, (r) => r.res.fly10 && r.res.fly10.time, "low"); o.time = bestOf(tr, (r) => r.res.time, "low"); }
    else { const vs = tr.filter((r) => r.res.last5); o.avg = avgOf(vs.map((r) => r.res.last5.speed)); o.carry = sTop && best ? best.v / sTop.v : null; o.lefts = modeOf(tr.map((r) => r.res.steps.lefts).filter(Boolean));
      const TO = tr.map((r) => r.res.takeoff.outFt).filter((x) => x != null); o.toSd = sdOf(TO); }
    return o;
  }).filter((o) => o.best).sort((x, y) => y.best.v - x.best.v);
  const top = rows[0].best.v, low = rows[rows.length - 1].best.v, bw = (v) => (top === low ? 100 : 35 + 65 * ((v - low) / (top - low)));
  let h = `<div class="card"><div class="between"><div class="label">Compare athletes · ${testName(test)}</div><div class="small muted">ranked by best ${km.label}</div></div>${isSprint ? "" : `<div class="small muted" style="margin-top:4px">Carry = best last 5 m as a % of sprint top speed. TO ± = how much the takeoff spot moves.</div>`}
    <div class="chips" style="margin:10px 0 4px">${withRuns.map((a) => { const i = sel.indexOf(a.id); return `<button class="chip" data-act="an-cmp" data-id="${a.id}" aria-pressed="${i >= 0}">${i >= 0 ? `<span class="dot" style="background:${ANC[i]}"></span>` : ""}${esc(a.name)}</button>`; }).join("")}</div>`;
  // speed curves: each selected athlete's best run, overlaid (lined up like Compare: from the start for sprints, at
  // the takeoff for vaults)
  const bestRuns = sel.map((id) => { const o = rows.find((x) => x.a.id === id); return o ? o.best.r : null; });
  const shown = bestRuns.map((r, i) => ({ r, i })).filter((x) => x.r && x.r.res && x.r.res.curve);
  if (shown.length) {
    const vault = !isSprint, xs = shown.map(({ r }) => compareX(r));
    const end = isSprint ? Math.max(...shown.map(({ r }) => r.target || 0)) : 0;
    const cut = shown.map(({ r }, k) => { const lim = isSprint ? r.target : 0; let j = xs[k].findIndex((x) => x > lim + 0.05); if (j < 0) j = xs[k].length; return { x: xs[k].slice(0, j), y: r.res.curve.v.slice(0, j) }; });
    const ymax = Math.ceil(Math.max(...shown.map(({ r }) => r.res.top.speed)) + 0.8);
    const x0 = vault ? Math.max(Math.floor(Math.min(...xs.map((x) => x[0]))), -30) : 0;
    h += lcSlot({ aria: "Speed curves of each athlete's best run", h: 230, x0, x1: vault ? 0 : end || Math.ceil(Math.max(...xs.map((x) => x[x.length - 1]))), y0: 0, y1: ymax,
      xTitle: vault ? "Distance before takeoff (m)" : "Distance (m)", yUnit: "m/s", xfmt: (t) => `${Math.abs(t)}`, vlines: vault ? [{ x: -5, label: "5 m out" }] : [],
      fmtPill: (x, vals) => vals.map((v, k) => (isFinite(v) ? `${esc(firstName(shown[k].r.athleteId))} ${f2(v)}` : "")).filter(Boolean).join("  ") + ` · ${f1(Math.abs(x))} m`,
      series: cut.map((c, k) => ({ x: c.x, y: c.y, color: ANC[shown[k].i], w: 2.4 })) });
    h += `<div class="small muted">Each athlete's best run (by ${km.label}). Drag across to read their speeds at the same spot.</div>`;

  // overlaid trend: best key metric per day, one line per athlete (only once there's more than one day to show)

  const per = sel.map((id) => { const by = bestPerDay(runs.filter((r) => r.athleteId === id && testKey(r) === test), km.pick); Object.keys(by).forEach((d) => allDays.add(d)); return by; });
  const dl = [...allDays].sort();

    per.forEach((by, i) => { const ds = Object.keys(by).sort(), X = ds.map(dx), Y = ds.map((d) => by[d].v); Y.forEach((y) => { lo = Math.min(lo, y); hi = Math.max(hi, y); });
      series.push({ x: X, y: Y, color: ANC[i], w: 2.4 }); X.forEach((x, j) => dots.push({ x, y: Y[j], color: ANC[i], attrs: `data-act="open-run" data-id="${by[ds[j]].r.id}" style="cursor:pointer"` })); });

      <span class="bar"><i style="width:${bw(o.best.v).toFixed(1)}%"></i></span><b>${f2(o.best.v)}</b></div>`).join("")}</div>`;
  // table
  const th = isSprint ? `<th>Athlete</th><th>Top<small>m/s</small></th><th>Fly 10<small>s</small></th><th>${test.split("-")[1]} m<small>s</small></th><th>Gap<small>m/s</small></th>` : `<th>Athlete</th><th>Best<small>m/s</small></th><th>Avg<small>m/s</small></th><th>Carry</th><th>Lefts</th><th>TO ±</th>`;
  const tds = (o) => isSprint

    : `<td>${esc(o.a.name)}</td><td><b>${f2(o.best.v)}</b></td><td>${o.avg ? f2(o.avg) : "—"}</td><td>${o.carry ? Math.round(o.carry * 100) + "%" : "—"}</td><td>${o.lefts || "—"}</td><td>${o.toSd != null ? spreadFt(o.toSd) : "—"}</td>`;
  h += `<div class="tw" style="margin-top:10px"><table class="cmpt"><thead><tr>${th}</tr></thead><tbody>${rows.map((o) => `<tr data-act="an-ath" data-id="${o.a.id}" style="cursor:pointer">${tds(o)}</tr>`).join("")}</tbody></table></div>`;
  // the main differences, written out

  if (isSprint) { const f = rows.filter((o) => o.fly).sort((x, y) => x.fly.v - y.fly.v); if (f.length > 1) notes.push(`Fastest flying 10 m: ${esc(f[0].a.name)} (${f2(f[0].fly.v)} s).`); }

function analyticsHTML() {
  if (!athletes.length) return `<h1>Analytics</h1><div class="card empty">Add an athlete and save some runs to see trends.</div>`;
  if (!anState.athleteId || !athletes.find((a) => a.id === anState.athleteId)) anState.athleteId = settings.lastAthlete && athletes.find((a) => a.id === settings.lastAthlete) ? settings.lastAthlete : athletes[0].id;
  const mine = runs.filter((r) => r.athleteId === anState.athleteId), myJumps = jumps.filter((j) => j.athleteId === anState.athleteId);
  const anReady = runs.some((r) => r.athleteId === anState.athleteId) || jumps.some((j) => j.athleteId === anState.athleteId);
  let h = `<div class="between" style="align-items:center"><h1>Analytics</h1>${anReady ? `<button class="btn sm" data-act="an-report" aria-label="Print report">Print report</button>` : ""}</div><div class="chips" style="margin-bottom:12px">${athletes.map((a) => `<button class="chip" data-act="an-ath" data-id="${a.id}" aria-pressed="${a.id === anState.athleteId}">${esc(a.name)}</button>`).join("")}</div>`;
  if (!mine.length && !myJumps.length) return h + `<div class="card empty">No runs or jumps for ${esc(athleteById(anState.athleteId).name)} yet.</div>`;
  const tests = [...new Set(mine.map(testKey))].sort(); if (myJumps.length) tests.push("jump");
  if (!anState.test || !tests.includes(anState.test)) anState.test = tests[0];
  h += `<div class="chips" style="margin-bottom:12px">${tests.map((t) => `<button class="chip" data-act="an-test" data-v="${t}" aria-pressed="${t === anState.test}">${t === "jump" ? "Vertical jump" : testShort(t)}</button>`).join("")}</div>`;
  if (anState.test === "jump") return h + jumpAnalyticsHTML(myJumps);
  const tr = mine.filter((r) => testKey(r) === anState.test);
  const isSprint = anState.test.startsWith("sprint");
  // best per day
  const byDay = {}; for (const r of tr) { const v = headline(r).value; if (v == null || !isFinite(v)) continue; const k = dayKey(r.ts); if (!byDay[k] || (isSprint ? v < byDay[k].v : v > byDay[k].v)) byDay[k] = { v, r }; }
  const days = Object.keys(byDay).sort();
  if (days.length) {
    const t0 = new Date(days[0]).getTime(), X = days.map((d) => (new Date(d).getTime() - t0) / 864e5), Y = days.map((d) => byDay[d].v);
    const lo = Math.min(...Y), hi = Math.max(...Y), padY = Math.max(0.05, (hi - lo) * 0.25);
    const x1 = Math.max(1, X[X.length - 1]);
    const chart = lcSlot({ aria: "Best per day", h: 230, x0: -0.5, x1: x1 + 0.5, y0: lo - padY, y1: hi + padY, yUnit: isSprint ? "s" : "m/s",
      yfmt: (t) => t.toFixed(2), xt: X.length > 1 ? [X[0], X[X.length - 1]] : [X[0]], xfmt: (t) => dayLabel(days[X.indexOf(t)] || days[0]),
      series: [{ x: X, y: Y, color: "var(--purple)", w: 2.4, fill: !isSprint }],
      dots: X.map((x, i) => ({ x, y: Y[i], attrs: `data-act="open-session" data-id="${days[i]}" style="cursor:pointer"` })) });
    h += `<div class="card"><div class="between"><div class="label">Best ${isSprint ? "time" : "last 5 m"} per day</div><div class="small muted">${isSprint ? "lower is better" : "higher is better"}</div></div>${chart}<div class="small muted">Tap a dot to open that session.</div></div>`;
  }
  // records
  h += `<div class="card"><div class="label" style="margin-bottom:6px">Personal records · ${testName(anState.test)}</div><div class="list">`;
  const rec = (label, pick, better, fmt) => {
    const best = bestOf(tr, pick, better);
    return best ? `<div class="item" data-act="open-run" data-id="${best.r.id}"><div>${label}<div class="small muted">${dayLabel(dayKey(best.r.ts))}</div></div><div class="r">${fmt(best.v)}</div></div>` : "";
  };
  if (isSprint) {
    h += rec("Time", (r) => r.res.time, "low", (v) => `${f2(v)} s`) + rec("Top speed", (r) => r.res.top.speed, "high", (v) => `${f2(v)} m/s`) + rec("Flying 10 m", (r) => r.res.fly10 && r.res.fly10.time, "low", (v) => `${f2(v)} s`);
  } else {
    h += rec("Last 5 m", (r) => r.res.last5 && r.res.last5.speed, "high", (v) => `${f2(v)} m/s`) + rec("Top speed", (r) => r.res.top.speed, "high", (v) => `${f2(v)} m/s`);
  }
  { const kg = tr.some((r) => r.res.fv && r.res.fv.P0abs); h += rec("Power", (r) => r.res.fv && (kg ? r.res.fv.P0abs : r.res.fv.P0), "high", (v) => (kg ? `${Math.round(v)} W` : `${f1(v)} W/kg`)); }
  h += `</div></div>`;
  // what matters for this test

  if (!isSprint && !(SETUPS[anState.test.split("-")[1]] || {}).pole) h += vaultHipCard(tr);
  // fastest at each distance (all sprints)

    let rows = "";
    for (const x of [5, 10, 15, 20, 25, 30, 40, 50, 60]) {

      for (const r of sprints) {

        const tc = x === r.target ? r.res.time : interpAt(r.res.curve.d, r.res.curve.t, x);
        if (isFinite(tc) && (!bc || tc < bc.v)) bc = { v: tc, r };
        const sp = r.res.splits.find((s) => s.to === x); if (sp && (!bs || sp.time < bs.v)) bs = { v: sp.time, r };

    }
    if (rows) h += `<div class="card tw"><div class="label" style="margin-bottom:6px">Fastest at each distance · all sprints</div><table><thead><tr><th>Distance</th><th>From start</th><th>5 m split</th><th>When</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  h += compareAthletesCard(anState.test);
  h += `<h2>Runs</h2>` + compareBar() + `<div class="card list">${tr.slice(0, 30).map((r) => runRow(r, true)).join("")}</div>`;
  return h;
}

// Analytics · Vertical jump: best per day (both heights), records, everyone's bests, every jump
function jumpAnalyticsHTML(mine) {
  const cm = (m) => (m * 100).toFixed(1);
  const byDay = {}; for (const j of mine) { const k = dayKey(j.ts); const d = byDay[k] || (byDay[k] = { h: 0, s: 0, n: 0 }); d.h = Math.max(d.h, j.h); d.s = Math.max(d.s, j.hStand || 0); d.n++; }
  const days = Object.keys(byDay).sort();

    const Y = days.map((d) => byDay[d].h * 100), S = days.map((d) => (byDay[d].s ? byDay[d].s * 100 : null));
    const all = Y.concat(S.filter((v) => v != null)), lo = Math.min(...all), hi = Math.max(...all), pad = Math.max(2, (hi - lo) * 0.2), x1 = Math.max(1, X[X.length - 1]);
    const sx = X.filter((_, i) => S[i] != null), sy = S.filter((v) => v != null);
    const chart = lcSlot({ aria: "Best jump per day", h: 220, x0: -0.5, x1: x1 + 0.5, y0: Math.max(0, lo - pad), y1: hi + pad, yUnit: "cm",
      yfmt: (t) => t.toFixed(0), xt: X.length > 1 ? [X[0], X[X.length - 1]] : [X[0]], xfmt: (t) => dayLabel(days[X.indexOf(t)] || days[0]),

// ---------------- moving runs from the sensor page to the home-screen app ----------------
// The sensor serves the app over plain http, which phones won't keep for offline use. The copy on
// GitHub (https) opens anywhere, so it's the home for all runs: record on the sensor page, then
// tap "Copy runs" there and "Paste runs" in the home-screen app. Runs are matched by id, athletes by name.
const SYNC_URL = "https://paytonpittspv.github.io/LiDAR-Sensor-App/";

async function pasteRuns() {

// merges runs (by id) and athletes (by id, then by name) from a copied text, a runs file or a backup
function addRunsFrom(text) {
  let j; try { j = JSON.parse(text); } catch (e) { j = null; }
  if (!j || j.app !== "paytons-lidar-sensor" || !Array.isArray(j.runs)) { toast("That isn't runs from this app. Tap Copy runs on the sensor page first."); return false; }
  const byId = new Map(athletes.map((a) => [a.id, a])), byName = new Map(athletes.map((a) => [a.name.trim().toLowerCase(), a])), map = {};
  let newA = 0;

    const hit = byId.get(a.id) || byName.get(String(a.name || "").trim().toLowerCase());
    if (hit) { map[a.id] = hit.id; if (!hit.kg && a.kg) hit.kg = a.kg; }

  for (const x of j.jumps || []) if (x && x.id && !haveJ.has(x.id)) { jumps.push(Object.assign({}, x, { athleteId: map[x.athleteId] || x.athleteId })); addedJ++; }
  if (addedJ) { jumps.sort((p, q) => q.ts - p.ts); saveJumps(); }

  const dup = j.runs.length - added;
  if (!added && addedJ) { toast(`Added ${addedJ} jump${addedJ > 1 ? "s" : ""}.`); render(); return true; }
  toast(added ? `Added ${added} run${added > 1 ? "s" : ""}${addedJ ? ` and ${addedJ} jump${addedJ > 1 ? "s" : ""}` : ""}${newA ? ` and ${newA} athlete${newA > 1 ? "s" : ""}` : ""}${dup ? ` (${dup} already here)` : ""}.` : `All ${j.runs.length} runs were already here.`);
  render(); return true;
}

  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `lidar-backup-${dayKey(Date.now())}.json`; document.body.appendChild(a); a.click(); a.remove();

function addDemoData() {
  const people = [["Demo Athlete", 68, 0], ["Demo Vaulter 2", 74, -0.35], ["Demo Vaulter 3", 63, 0.2]];
  const now = Date.now();
  for (const [name, kg, dv] of people) {
    let a = athletes.find((x) => x.name === name);
    if (!a) { a = { id: uid(), name, kg }; athletes.push(a); }
    for (let day = 13; day >= 0; day -= 3) {
      for (let rep = 0; rep < 2; rep++) {
        const ts = now - day * 864e5 - (3 - rep) * 600e3;
        const vmax = 8.7 + dv + (13 - day) * 0.03 + Math.random() * 0.15;
        const s = Engine.simulate({ seed: Math.floor(Math.random() * 1e6) + 1, vmax, target: 30, back: 3 });
        const res = Engine.process(s.raw, { mode: "sprint", target: 30, mass: a.kg });
        if (!res.error) runs.push({ id: uid(), ts, athleteId: a.id, mode: "sprint", target: 30, res, sim: true });
        const setup = ["runway100", "runway150", "polerun100"][(day / 3 + rep) % 3 | 0];
        const steps = 2 * (setup === "runway150" ? 9 + (rep % 2) : 7 + (rep % 2)) + 1;   // start + an even number of steps
        const carry = 0.55 + (name.endsWith("2") ? 0.25 : 0) + Math.random() * 0.2;
        const sv = Engine.simulate({ seed: Math.floor(Math.random() * 1e6) + 1, vmax: vmax - carry, steps, back: 2.5, popup: !!SETUPS[setup].pole, flight: 0.55 });
        const ctx = { mode: "vault", setup, mass: a.kg };
        {
          const probe = Engine.process(sv.raw, Object.assign({ noBox: true }, ctx)), box = SETUPS[setup].boxFt * FT;
          if (!probe.error) { const shift = Math.round((box - (11 + Math.random() * 2.5) * FT - 0.5 - probe.takeoff.sensor) * 100); sv.raw.d = sv.raw.d.map((cm) => (cm > 0 ? Math.max(1, cm + shift) : cm)); }
        }
        const rv = Engine.process(sv.raw, ctx);
        if (!rv.error) { const run = { id: uid(), ts: ts + 300e3, athleteId: a.id, mode: "vault", setup, res: rv, sim: true }; simPodPeak(run); runs.push(run); }
      }
    }
  }
  // vertical jumps: three a day, slowly getting higher
  for (const [name, , dv] of people) {
    const a = athletes.find((x) => x.name === name); if (!a) continue;
    for (let day = 13; day >= 0; day -= 3) for (let rep = 0; rep < 3; rep++) {
      const hT = 0.46 + dv * 0.12 + (13 - day) * 0.002 + (Math.random() - 0.5) * 0.04;

    }
  }
  jumps.sort((x, y) => y.ts - x.ts); saveJumps();
  saveAthletes(); runs.sort((x, y) => y.ts - x.ts); saveRuns(); toast("Demo data added"); render();
}

  };
