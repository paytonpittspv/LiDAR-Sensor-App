}

<div id="report" class="hidden"></div>
<script>
// ===== ENGINE START =====
// Measurement engine for PAYTON'S LiDAR SENSOR.
// One smoothed distance line is made first; speed, splits, top speed and the takeoff all come from it.
const Engine = (() => {
  const FT = 0.3048;

  // ---------- filters ----------
  function biquadLP(fc, fs) {
    const w0 = (2 * Math.PI * fc) / fs, c = Math.cos(w0), al = Math.sin(w0) / (2 * Math.SQRT1_2);
    const a0 = 1 + al;
    return { b0: (1 - c) / 2 / a0, b1: (1 - c) / a0, b2: (1 - c) / 2 / a0, a1: (-2 * c) / a0, a2: (1 - al) / a0 };
  }
  function runBiquad(x, q) {
    const y = new Float64Array(x.length);
    let x1 = x[0], x2 = x[0], y1 = x[0], y2 = x[0];
    for (let i = 0; i < x.length; i++) {
      const v = q.b0 * x[i] + q.b1 * x1 + q.b2 * x2 - q.a1 * y1 - q.a2 * y2;
      x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v;
    }
    return y;
  }
  // zero-phase low-pass (forward + backward), with mirrored padding so the ends don't droop
  function filtfilt(x, fc, fs) {
    const n = x.length, pad = Math.min(n - 1, Math.round((3 * fs) / fc));
    const ext = new Float64Array(n + 2 * pad);
    for (let i = 0; i < pad; i++) { ext[i] = 2 * x[0] - x[pad - i]; ext[n + pad + i] = 2 * x[n - 1] - x[n - 2 - i]; }
    ext.set(x, pad);
    const q = biquadLP(fc, fs);
    let y = runBiquad(ext, q);
    y.reverse(); y = runBiquad(y, q); y.reverse();
    return y.slice(pad, pad + n);
  }
  function deriv(x, fs) {
    const n = x.length, v = new Float64Array(n);
    for (let i = 1; i < n - 1; i++) v[i] = ((x[i + 1] - x[i - 1]) * fs) / 2;
    v[0] = v[1]; v[n - 1] = v[n - 2];
    return v;
  }

  // ---------- 1) raw sensor frames → one clean, evenly spaced distance track ----------
  function track(raw, limitCm) {
    const n = raw.t.length;
    if (n < 300) return { error: "Not enough data recorded." };
    // The sensor sends frames at a fixed rate: fit time vs frame number to remove Wi-Fi/serial jitter.
    let sx = 0, sy = 0, sxx = 0, sxy = 0;
    const t0 = raw.t[0];
    for (let i = 0; i < n; i++) { const y = (raw.t[i] - t0) | 0; sx += i; sy += y; sxx += i * i; sxy += i * y; }
    const b = (n * sxy - sx * sy) / (n * sxx - sx * sx), a = (sy - b * sx) / n;
    const fs = 1e6 / b;
    const T = [], D = [];
    for (let i = 0; i < n; i++) { const cm = raw.d[i]; if (cm > 10 && cm < Math.min(raw.maxCm, limitCm || Infinity)) { T.push((a + b * i) / 1e6); D.push(cm / 100); } }
    if (T.length < 300) return { error: "The sensor didn't see the athlete for most of the run. Check the aim." };
    // Drop single bad readings (arms, the pole, background) with a running median.
    const W = 15, kt = [], kd = [];
    for (let k = 0; k < D.length; k++) {
      const lo = Math.max(0, k - W), hi = Math.min(D.length, k + W + 1);
      const win = D.slice(lo, hi).sort((p, q) => p - q), med = win[win.length >> 1];
      if (Math.abs(D[k] - med) < 0.35) { kt.push(T[k]); kd.push(D[k]); }
    }
    // Split into continuous pieces (a gap over 0.12 s = athlete lost) and keep the piece that travels furthest.
    const pieces = []; let s = 0;
    for (let k = 1; k <= kt.length; k++) if (k === kt.length || kt[k] - kt[k - 1] > 0.12) { pieces.push([s, k]); s = k; }
    let best = pieces[0], bestGain = -1;
    for (const [p0, p1] of pieces) {
      if (p1 - p0 < 50) continue;
      let mn = Infinity, mx = -Infinity; for (let k = p0; k < p1; k++) { mn = Math.min(mn, kd[k]); mx = Math.max(mx, kd[k]); }
      if (mx - mn > bestGain) { bestGain = mx - mn; best = [p0, p1]; }
    }
    // Resample that piece onto an even grid.
    const [p0, p1] = best, dt = 1 / fs;
    const m = Math.floor((kt[p1 - 1] - kt[p0]) / dt) + 1;
    const d = new Float64Array(m); let j = p0;
    for (let i = 0; i < m; i++) {
      const t = kt[p0] + i * dt;
      while (j < p1 - 2 && kt[j + 1] < t) j++;
      const f = (t - kt[j]) / ((kt[j + 1] - kt[j]) || 1e-9);
      d[i] = kd[j] + Math.max(0, Math.min(1, f)) * (kd[j + 1] - kd[j]);
    }
    return { fs, t0: kt[p0], d, lostAtEnd: p1 < kt.length || true };
  }

  // ---------- 2) smooth distance, then speed from it ----------
  const SMOOTH_HZ = 3;     // the one line: splits, speed curve and top speed all use this
  const STEP_HZ = 7;       // keeps the per-step speed wobble, only used to find foot contacts
  const RAW_HZ = 12;
  const STRIDE_S = 0.46;
  let SHARPEN = false, REPAIR = true, FLIGHT_DROP = 0.05, FLIGHT_LAG = 0.045;   // one stride (two steps) for the speed curve and top speed       // "raw speed" line drawn on charts
  function lines(tr) {
    const ds = filtfilt(tr.d, SMOOTH_HZ, tr.fs);
    const v = deriv(ds, tr.fs);
    const vStep = deriv(filtfilt(tr.d, STEP_HZ, tr.fs), tr.fs);
    const vRaw = deriv(filtfilt(tr.d, RAW_HZ, tr.fs), tr.fs);
    // stride speed: distance covered over one stride (~0.46 s, two steps) of the same smoothed line,
    // so the curve shows the run, not the small speed-up/slow-down inside every step
    const h = Math.round(STRIDE_S / 2 * tr.fs), n = ds.length, vStride = new Float64Array(n);
    for (let k = 0; k < n; k++) { const a = Math.max(0, k - h), b = Math.min(n - 1, k + h); vStride[k] = b > a ? (ds[b] - ds[a]) / ((b - a) / tr.fs) : v[k]; }
    return { d: tr.d, ds, v, vStep, vRaw, vStride };
  }

  // time when the smoothed distance first reaches x (searching from index k0)
  function crossTime(ds, fs, k0, x) {
    if (ds[k0] >= x) return k0 / fs;
    for (let k = k0 + 1; k < ds.length; k++) if (ds[k] >= x) { const f = (x - ds[k - 1]) / ((ds[k] - ds[k - 1]) || 1e-9); return (k - 1 + f) / fs; }
    return NaN;
  }

  // ---------- 3) foot contacts and lefts ----------
  // Each foot contact slows the trunk a little, then the push speeds it up again: one wobble in speed per step.
  // We take that wobble (step-speed minus smoothed speed), keep only step-like frequencies (1.8–6.5 Hz), and
  // follow its phase: one full turn = one step, a contact sits at the bottom of each turn. Counting turns is
  // much steadier than hunting for individual dips. Then we walk back from the takeoff (a left) and stop at
  // the first step that breaks the rhythm, so hops, skips and walk-ins aren't counted.
  function fft(re, im, inv) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = ((inv ? 2 : -2) * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const ar = re[i + k], ai = im[i + k], br = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, bi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
          re[i + k] = ar + br; im[i + k] = ai + bi; re[i + k + len / 2] = ar - br; im[i + k + len / 2] = ai - bi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
    if (inv) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
  }
  function stepPhase(L, fs, kFrom, kTo) {
    const dec = Math.max(1, Math.round(fs / 200)), f2 = fs / dec;
    const m = Math.floor((kTo - kFrom) / dec) + 1;
    let N = 1; while (N < m * 2) N <<= 1;
    const re = new Float64Array(N), im = new Float64Array(N);
    // use the distance wobble (raw distance minus the smooth line): less noisy than a speed wobble
    for (let i = 0; i < m; i++) { const k = kFrom + i * dec; let a = 0; for (let q = 0; q < dec; q++) a += L.d[Math.min(L.d.length - 1, k + q)] - L.ds[Math.min(L.d.length - 1, k + q)]; re[i] = a / dec / Math.max(1, L.v[k]); }
    // taper the ends a little
    const tap = Math.min(m >> 3, Math.round(0.2 * f2));
    for (let i = 0; i < tap; i++) { const w = 0.5 - 0.5 * Math.cos((Math.PI * i) / tap); re[i] *= w; re[m - 1 - i] *= w; }
    fft(re, im, false);
    for (let i = 0; i < N; i++) {
      const f = i <= N / 2 ? (i * f2) / N : -((N - i) * f2) / N;
      if (f < 1.8 || f > 6.5) { re[i] = 0; im[i] = 0; } else { re[i] *= 2; im[i] *= 2; }   // analytic, band-limited
    }
    fft(re, im, true);
    const ph = new Float64Array(m), amp = new Float64Array(m);
    let prev = 0, off = 0;
    for (let i = 0; i < m; i++) {
      let p = Math.atan2(im[i], re[i]) + Math.PI / 2;   // speed wobble leads the distance wobble by a quarter turn
      if (i) { while (p + off - prev > Math.PI) off -= 2 * Math.PI; while (p + off - prev < -Math.PI) off += 2 * Math.PI; }
      ph[i] = p + off; prev = ph[i]; amp[i] = Math.hypot(re[i], im[i]);
    }
    return { ph, amp, dec, f2, kFrom, m };
  }
  // contacts = where the phase passes the bottom of the wobble (π, 3π, ...)
  function contactsFromPhase(S, L) {
    let out = [];
    // phase only moves forward (stops wobbles around a crossing from counting twice)
    const mono = new Float64Array(S.m); mono[0] = S.ph[0];
    for (let i = 1; i < S.m; i++) mono[i] = Math.max(mono[i - 1], S.ph[i]);
    for (let i = 1; i < S.m; i++) {
      const a = mono[i - 1], b = mono[i];
      const na = Math.floor((a - Math.PI) / (2 * Math.PI)), nb = Math.floor((b - Math.PI) / (2 * Math.PI));
      if (nb > na) { const target = Math.PI + 2 * Math.PI * nb; const f = (target - a) / ((b - a) || 1e-9); out.push(S.kFrom + (i - 1 + f) * S.dec); }
    }
    out = out.map((k) => Math.round(k));
    // merge contacts that are far closer together than the steps around them (a phase slip, not a step)
    const fsx = S.f2 * S.dec;
    let changed = true;
    while (changed && out.length > 3) {
      changed = false;
      for (let i = 1; i < out.length; i++) {
        const lo = Math.max(1, i - 3), hi = Math.min(out.length - 1, i + 3), ivs = [];
        for (let j = lo; j <= hi; j++) if (j !== i) ivs.push(out[j] - out[j - 1]);
        const med = ivs.sort((a, b) => a - b)[ivs.length >> 1] || 0;
        if (out[i] - out[i - 1] < 0.62 * med && out[i] - out[i - 1] < 0.2 * fsx) { out.splice(i, 1, Math.round((out[i] + out[i - 1]) / 2)); out.splice(i - 1, 1); changed = true; break; }
      }
    }
    return out;
  }
  // pole run off the runway: no box, so no plant. The takeoff shows up as the step rhythm stopping
  // (in the air there are no foot contacts). Find the first contact after which the wobble dies away
  // for most of a stride, once the athlete is near top speed; that contact is the takeoff.
  function flightTakeoff(L, fs, kGo, kTopAll, n) {
    // The takeoff step turns forward speed into lift: speed drops ~10% over that one contact, then holds
    // steady in the air (no feet, no push) until the landing. Find the first drop after top speed that is
    // followed by that steady stretch; the takeoff contact is just before the drop shows.
    const win = Math.round(0.5 * fs), air = Math.round(0.25 * fs);
    for (let k = kTopAll; k < n - air; k++) {
      let mx = 0; for (let q = Math.max(0, k - win); q <= k; q += 5) mx = Math.max(mx, L.v[q]);
      if (L.vStep[k] >= (1 - FLIGHT_DROP) * mx) continue;
      // steady after: over the next 0.25 s the speed changes by less than half the drop again
      const v0 = L.v[k + Math.round(0.05 * fs)], v1 = L.v[k + air];
      if (Math.abs(v1 - v0) < 0.5 * FLIGHT_DROP * mx) return k - Math.round(FLIGHT_LAG * fs);
    }
    return null;
  }
  // kAnchor = where we expect the last contact (the takeoff for vault)
  function trackSteps(L, fs, kGo, kEnd, kAnchor) {
    const kFrom = Math.max(0, kGo - Math.round(0.6 * fs)), kTo = Math.min(L.v.length - 1, kEnd + Math.round(0.2 * fs));
    const S = stepPhase(L, fs, kFrom, kTo);
    const contacts = contactsFromPhase(S, L);
    // takeoff / last step: carry the rhythm of the steady steps just before the plant forward to it,
    // then use the contact that sits there (or the predicted spot if the plant blurred that dip)
    let lastIdx = -1;
    // (the plant bends the last ~0.3 s of the wobble, so only trust contacts before that)
    const before = contacts.filter((k) => k < kAnchor - 0.3 * fs);
    if (before.length >= 4) {
      const iv = []; for (let i = before.length - 4; i < before.length; i++) iv.push(before[i] - before[i - 1]);
      const Im = iv.sort((a, b) => a - b)[iv.length >> 1];
      let cur = before[before.length - 1];
      const chain = before.slice();
      while (cur + 0.5 * Im <= kAnchor + 0.06 * fs) {
        const pred = cur + Im;
        const snap = contacts.filter((k) => Math.abs(k - pred) <= 0.3 * Im).sort((a, b) => Math.abs(a - pred) - Math.abs(b - pred))[0];
        cur = snap != null ? snap : Math.round(pred); chain.push(cur);
      }
      contacts.splice(0, contacts.length, ...chain);
      lastIdx = contacts.length - 1;
    } else {
      let bestD = 0.12 * fs;
      contacts.forEach((k, i) => { const d = Math.abs(k - kAnchor); if (d <= bestD) { bestD = d; lastIdx = i; } });
    }
    if (lastIdx < 0) return [];
    // typical wobble size during the run, to spot where the rhythm fades out
    const ampAt = (k) => S.amp[Math.max(0, Math.min(S.m - 1, Math.round((k - S.kFrom) / S.dec)))];
    // (skip the last two steps: the plant makes the wobble there look bigger than it is)
    const amps = contacts.slice(Math.max(0, lastIdx - 10), Math.max(1, lastIdx - 1)).map(ampAt).sort((a, b) => a - b);
    const refAmp = amps[amps.length >> 1] || 0;
    const out = [contacts[lastIdx]];
    let guesses = 0;
    for (let i = lastIdx - 1; i >= 0; i--) {
      const last = out[out.length - 1], k = contacts[i], dt = (last - k) / fs;
      // reference = median of the last three step times we accepted (one noisy step won't break the count)
      const recent = []; for (let j = Math.max(1, out.length - 3); j < out.length; j++) recent.push((out[j - 1] - out[j]) / fs);
      const ref = recent.length ? recent.sort((a, b) => a - b)[recent.length >> 1] : dt;
      if (L.v[k] < 1.5) break;                                            // before the run started
      if (out.length > 1 && dt < ref * 0.6) continue;                     // a stray contact between two steps: skip it
      if (dt < 0.17) continue;
      if (out.length > 1 && dt >= ref * 1.7 && dt <= ref * 2.3 && L.v[k] > 4 && guesses < 2) {
        out.push(Math.round((last + k) / 2)); guesses++;                  // one dip missed inside a steady rhythm
      } else if (dt > 0.5 || (out.length > 1 && dt > ref * 1.8)) break;  // rhythm breaks (hop, skip, walk-in)
      // wobble gone for two steps in a row: no real steps here
      if (ampAt(k) < 0.2 * refAmp && i > 0 && ampAt(contacts[i - 1]) < 0.2 * refAmp) break;
      out.push(k);
    }
    return out.reverse();
  }

  // ---------- 4) force–velocity profile (simple model, no air resistance) ----------
  function fvProfile(L, fs, kGo, kTop, mass) {
    // fit v(t) = vmax * (1 - e^(-t/tau)) to the smoothed speed from the start to top speed
    let best = null;
    const n = kTop - kGo; if (n < fs * 0.8) return null;
    const stepK = Math.max(1, Math.round(fs / 100));
    for (let tau = 0.5; tau <= 2.5; tau += 0.005) {
      let sxy = 0, sxx = 0;
      for (let k = kGo; k <= kTop; k += stepK) { const x = 1 - Math.exp(-((k - kGo) / fs) / tau); sxy += x * L.v[k]; sxx += x * x; }
      const vmax = sxy / sxx; let err = 0;
      for (let k = kGo; k <= kTop; k += stepK) { const e = L.v[k] - vmax * (1 - Math.exp(-((k - kGo) / fs) / tau)); err += e * e; }
      if (!best || err < best.err) best = { tau, vmax, err };
    }
    const { tau, vmax } = best, F0 = vmax / tau, P0 = (F0 * vmax) / 4, slope = -F0 / vmax;
    // model curves for power and force over the run
    let pk = 0, sumP = 0, sumF = 0, c = 0;
    const T = (kTop - kGo) / fs;
    for (let t = 0; t <= T; t += 0.01) { const a = (vmax / tau) * Math.exp(-t / tau), v = vmax * (1 - Math.exp(-t / tau)); const p = a * v; pk = Math.max(pk, p); sumP += p; sumF += a; c++; }
    return { tau, V0: vmax, F0, P0, slope, peakPowerKg: pk, meanPowerKg: sumP / c, meanForceKg: sumF / c,
      F0abs: mass ? F0 * mass : null, P0abs: mass ? P0 * mass : null, peakPower: mass ? pk * mass : null, meanPower: mass ? (sumP / c) * mass : null, meanForce: mass ? (sumF / c) * mass : null };
  }

  // ---------- main ----------
  // ctx: { mode: "sprint", target: m } | { mode: "vault", setup: "runway100" | "runway150" | "polerun100" | "polerun150" }, mass (kg, optional)
  function process(raw, ctx) {
    // vault: the tripod is 100 or 150 ft from the box (on the runway) or from the box mark (pole runs);

// ---------------- compare ----------------
let compareSel = [];
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];

function toggleCompare(id) {

}
function compareX(run) {

  return run.mode === "sprint" ? run.res.curve.d : run.res.curve.d.map((d) => d - run.res.takeoff.dist);
}
function interpAt(xs, ys, x) { if (x < xs[0] || x > xs[xs.length - 1]) return NaN; let j = 1; while (j < xs.length && xs[j] < x) j++; const f = (x - xs[j - 1]) / ((xs[j] - xs[j - 1]) || 1e-9); return ys[j - 1] + f * (ys[j] - ys[j - 1]); }
function compareText(list) {
  const out = [], names = list.map((r, i) => `${String.fromCharCode(65 + i)}`);
  const label = (i) => `${names[i]} (${esc(athleteById(list[i].athleteId).name.split(" ")[0])})`;
  const allSprint = list.every((r) => r.mode === "sprint"), allVault = list.every((r) => r.mode === "vault");
  if (allSprint) {
    const T = Math.min(...list.map((r) => r.target));
    const tAt = (r, x) => (x === r.target ? r.res.time : interpAt(r.res.curve.d, r.res.curve.t, x));
    const times = list.map((r) => tAt(r, T)), best = times.indexOf(Math.min(...times));
    out.push(`<b>${label(best)}</b> was fastest to ${T} m in <b>${f2(times[best])} s</b>.` + list.map((r, i) => (i === best ? "" : ` ${label(i)} was ${f2(times[i] - times[best])} s behind.`)).join(""));
    // where the gap appears
    for (let i = 0; i < list.length; i++) {
      if (i === best) continue;
      let at = null; for (let x = 5; x <= T; x += 5) if (tAt(list[i], x) - tAt(list[best], x) > 0.05) { at = x; break; }
      let worst = null, wd = 0; for (let x = 5; x <= T; x += 5) { const dd = (tAt(list[i], x) - tAt(list[i], x - 5)) - (tAt(list[best], x) - tAt(list[best], x - 5)); if (dd > wd) { wd = dd; worst = x; } }
      if (at != null) out.push(`${label(i)} fell more than 0.05 s behind by <b>${at} m</b>; the most time went in the <b>${worst - 5}–${worst} m</b> split (${f2(wd)} s).`);
    }
    const tops = list.map((r) => r.res.top.speed), tb = tops.indexOf(Math.max(...tops));
    out.push(`Highest top speed: <b>${label(tb)} ${f2(tops[tb])} m/s</b>` + (list.length > 1 ? `, ${f2(tops[tb] - Math.min(...tops))} m/s above the lowest.` : "."));
  } else if (allVault) {
    const l5 = list.map((r) => (r.res.last5 ? r.res.last5.speed : NaN)), b = l5.indexOf(Math.max(...l5.filter(isFinite)));
    if (b >= 0) out.push(`Fastest into takeoff: <b>${label(b)} ${f2(l5[b])} m/s</b> over the last 5 m.`);
    const lefts = list.map((r) => r.res.steps.lefts);
    if (new Set(lefts).size > 1) out.push(`Lefts differ: ${list.map((r, i) => `${names[i]} ${lefts[i] || "?"}`).join(", ")}.`);
    const tos = list.map((r) => r.res.takeoff.outFt).filter((x) => x != null);
    if (tos.length > 1) out.push(`Takeoff spots spread over <b>${ftLabel(Math.max(...tos) - Math.min(...tos))}</b> (${list.map((r, i) => `${names[i]} ${ftLabel(r.res.takeoff.outFt)}`).join(", ")}).`);
    list.forEach((r, i) => { const c = changeTag(r.res); if (c && c.cls === "down") out.push(`${label(i)}: ${c.text.toLowerCase()}.`); });
  } else out.push("These runs are different tests, so only the curves are shown side by side.");

  }

}

    : [["Last 5 m", (r) => f2(r.res.last5 && r.res.last5.speed)], ["10 → 5 m out", (r) => f2(r.res.prev5 && r.res.prev5.speed)], ["Top speed", (r) => f2(r.res.top.speed)], ["Lefts", (r) => r.res.steps.lefts || "—"],
       ["Takeoff ≈", (r) => (r.res.takeoff.outFt != null ? ftLabel(r.res.takeoff.outFt) : "—")], ["Approach time", (r) => `${f2(r.res.approachTime)} s`]];

// ---------------- home: greeting and quick recaps (the full lists live in Sessions and Analytics) ----------------
function greeting() {
  const d = new Date(), hr = d.getHours();
  const sets = hr < 5 ? [["Rest is training too.", "Late one. Recover well and come back fast."], ["Welcome back!", "Your numbers are waiting."]]
    : hr < 11 ? [["Good morning!", "Fresh legs, fast runs."], ["Time to record some speed!", "Set up the tripod and let's go."], ["Early reps count.", "One step closer to a new best."]]
    : hr < 17 ? [["Welcome back!", "Ready for today's session?"], ["Time to record some speed!", "Every run gets you closer."], ["One step closer…", "to your fastest approach yet."]]
    : hr < 22 ? [["Evening session?", "Let's see what the legs have left."], ["One step closer…", "to your fastest approach yet."], ["Welcome back!", "Here's where things stand."]]
    : [["Welcome back!", "Here's how today went."], ["Rest up.", "Speed is built in recovery too."]];
  // the same line for the whole hour, so it doesn't change every time the screen redraws
  const seed = d.getFullYear() * 1e4 + (d.getMonth() + 1) * 100 + d.getDate() + hr * 7;
  return sets[seed % sets.length];
}
// every time an athlete beat their own best (not counting their first run)
function prEvents() {
  const asc = runs.slice().sort((a, b) => a.ts - b.ts), best = {}, ev = [];
  const metrics = [
    ["Top speed", (r) => r.mode === "sprint" && r.res.top && r.res.top.speed, "high", (v) => `${f2(v)} m/s`],
    ["Flying 10 m", (r) => r.mode === "sprint" && r.res.fly10 && r.res.fly10.time, "low", (v) => `${f2(v)} s`],
    ["Last 5 m into takeoff", (r) => r.mode === "vault" && r.res.last5 && r.res.last5.speed, "high", (v) => `${f2(v)} m/s`],
  ];
  for (const r of asc) for (const [name, pick, better, fmt] of metrics) {
    const v = pick(r); if (!v || !isFinite(v)) continue;
    const k = r.athleteId + name, b = best[k];
    if (b == null) { best[k] = v; continue; }
    if (better === "low" ? v < b : v > b) { ev.push({ r, name, text: fmt(v), gain: better === "low" ? `−${f2(b - v)} s` : `+${f2(v - b)} m/s` }); best[k] = v; }
  }
  return ev.reverse();

    <div class="list" style="margin-top:6px">

    </div></div>`;
  return h;
}

function vaultProfileCard(tr) {
  const ok = tr.filter((r) => r.res.last5);
  if (!ok.length) return "";
  const setup = anState.test.split("-")[1], hasBox = true;
  const L5 = ok.map((r) => r.res.last5.speed), lefts = ok.map((r) => r.res.steps.lefts).filter(Boolean);
  const TO = ok.map((r) => r.res.takeoff.outFt).filter((x) => x != null), SM = ok.map((r) => r.res.startMarkFt).filter((x) => x != null);
  const sTop = sprintTopFor(anState.athleteId);
  const lastLeft = ok.map((r) => { const n = r.res.steps.times.length; if (!n) return null; const k = r.res.curve.t.findIndex((t) => t >= r.res.steps.times[n - 3 >= 0 ? n - 3 : 0]); return k >= 0 ? r.res.curve.v[k] : null; }).filter((x) => x != null);
  let h = `<div class="card"><div class="between"><div class="label">${esc(SETUPS[setup].name)} · consistency</div><div class="small muted">${ok.length} jump${ok.length > 1 ? "s" : ""}</div></div>`;
  if (hasBox && TO.length >= 2) {
    // does more speed move the takeoff? each dot is one jump
    const pts = ok.filter((r) => r.res.takeoff.outFt != null), xs = pts.map((r) => r.res.takeoff.outFt), ys = pts.map((r) => r.res.last5.speed);
    const xa = Math.floor(Math.min(...xs) - 1), xb = Math.ceil(Math.max(...xs) + 1), ya = Math.min(...ys), yb = Math.max(...ys), pad = Math.max(0.1, (yb - ya) * 0.3);
    h += `<div class="small muted" style="margin-top:4px">Each dot is a jump: speed into the takeoff against the takeoff spot.</div>` + lcSlot({ aria: "Last 5 m against takeoff spot", h: 200, x0: xa, x1: xb, y0: ya - pad, y1: yb + pad, yUnit: "m/s", xTitle: "Takeoff, feet out from the box", yfmt: (t) => t.toFixed(1),
      series: [], dots: pts.map((r, i) => ({ x: xs[i], y: ys[i], attrs: `data-act="open-run" data-id="${r.id}" style="cursor:pointer"` })) });
  }
  // where the lefts land, jump after jump (last 10)
  const lj = ok.filter((r) => contactsOf(r).length).sort((x, y) => x.ts - y.ts).slice(-10);
  if (lj.length) {
    const mid = settings.midOut, col = []; for (const r of lj) { const c = contactsOf(r).find((x) => x.left && x.out === mid); if (c) col.push(spotFt(r, c)); }
    const midTxt = col.length ? `${ftLabel(avgOf(col))}${col.length > 1 ? ` ${spreadFt(sdOf(col))}` : ""}` : "—";
    h += `<div class="label" style="margin:14px 0 6px">Where the lefts land · last ${lj.length} jump${lj.length > 1 ? "s" : ""}</div>
      ${runwayMap(lj.map((r) => ({ run: r, label: `${dayLabel(dayKey(r.ts))} ${timeLabel(r.ts)}` })), { mid })}
      <div class="between" style="margin:8px 0 4px;gap:8px;flex-wrap:wrap"><span class="small muted">Mid mark at</span><div class="chips">${[2, 3, 4, 5, 6].map((k) => `<button class="chip sm" data-act="mid-out" data-v="${k}" aria-pressed="${k === mid}">${k} lefts out</button>`).join("")}</div></div>
      <div class="midbox"><div><div class="small muted">Mid mark · ${mid} lefts out from takeoff</div><div class="big2">${midTxt}</div></div><div class="small muted" style="text-align:right">${SETUPS[setup].pole ? "from the box mark" : "from the box"}<br>${col.length} jump${col.length === 1 ? "" : "s"}</div></div>
      ${leftsMatrix(lj, { stats: true, mid, rowLabel: (r) => `${dayLabel(dayKey(r.ts))} ${timeLabel(r.ts)}` })}
      <div class="small muted" style="margin-top:4px">Each column is a left counted back from the takeoff. A small spread means that left lands in the same spot every jump. If the takeoff column moves but the mid mark doesn't, the change is in the last steps.</div>`;
  }
  const fin = ok.map((r) => r.res.finish && r.res.finish.change).filter((x) => x != null && isFinite(x));
  h += `<div class="list" style="margin-top:6px">
    ${fin.length ? statRow("Into the box", `${avgOf(fin) >= 0 ? "+" : "−"}${Math.abs(avgOf(fin)).toFixed(2)} m/s`, `average speed change in the last ½ s before the plant · ${fin.filter((x) => x <= -0.1).length} of ${fin.length} slowed`) : ""}
    ${statRow("Last 5 m", `${f2(avgOf(L5))} m/s`, `average · best ${f2(Math.max(...L5))} · spread ±${f2(sdOf(L5) || 0)}`)}
    ${sTop ? statRow("Carried from sprint top speed", `${Math.round((avgOf(L5) / sTop.v) * 100)}%`, `average last 5 m ÷ best sprint top speed (${f2(sTop.v)} m/s)`) : statRow("Carried from sprint top speed", "—", "save a sprint test to see this")}
    ${lastLeft.length ? statRow("Speed 3 steps before takeoff", `${f2(avgOf(lastLeft))} m/s`, "average") : ""}
    ${lefts.length ? statRow("Lefts", `${modeOf(lefts)}`, Math.min(...lefts) === Math.max(...lefts) ? "every jump" : `most often · range ${Math.min(...lefts)}–${Math.max(...lefts)}`) : ""}
    ${TO.length ? statRow("Takeoff spot", ftLabel(avgOf(TO)), TO.length > 1 ? `average · spread ${spreadFt(sdOf(TO))} · range ${ftLabel(Math.min(...TO))}–${ftLabel(Math.max(...TO))}` : "one jump") : ""}
    ${SM.length ? statRow("Start mark", ftLabel(avgOf(SM)), SM.length > 1 ? `average · spread ${spreadFt(sdOf(SM))}` : "") : ""}
  </div></div>`;
  return h;
}

function compareAthletesCard(test) {
  const isSprint = test.startsWith("sprint"), km = keyMetric(test);
  const withRuns = athletes.filter((a) => runs.some((r) => r.athleteId === a.id && testKey(r) === test));
  if (withRuns.length < 2) return `<div class="card"><div class="label">Compare athletes · ${testName(test)}</div><div class="small muted" style="margin-top:6px">Only one athlete has ${testName(test)} runs so far. Add another athlete's runs to compare.</div></div>`;
  if (!anState.cmp) anState.cmp = withRuns.slice(0, 4).map((a) => a.id);
  const sel = anState.cmp.filter((id) => withRuns.some((a) => a.id === id));
  // one row per athlete with this test
  const rows = withRuns.map((a) => {
    const tr = runs.filter((r) => r.athleteId === a.id && testKey(r) === test);
    const best = bestOf(tr, km.pick, "high"), sTop = sprintTopFor(a.id), last = tr.reduce((p, q) => (q.ts > p.ts ? q : p));
    const o = { a, n: tr.length, best, last };
    if (isSprint) { o.fly = bestOf(tr, (r) => r.res.fly10 && r.res.fly10.time, "low"); o.time = bestOf(tr, (r) => r.res.time, "low"); }
    else { const vs = tr.filter((r) => r.res.last5); o.avg = avgOf(vs.map((r) => r.res.last5.speed)); o.carry = sTop && best ? best.v / sTop.v : null; o.lefts = modeOf(tr.map((r) => r.res.steps.lefts).filter(Boolean));
      const TO = tr.map((r) => r.res.takeoff.outFt).filter((x) => x != null); o.toSd = sdOf(TO); }
    return o;
  }).filter((o) => o.best).sort((x, y) => y.best.v - x.best.v);
  const top = rows[0].best.v, low = rows[rows.length - 1].best.v, bw = (v) => (top === low ? 100 : 35 + 65 * ((v - low) / (top - low)));
  let h = `<div class="card"><div class="between"><div class="label">Compare athletes · ${testName(test)}</div><div class="small muted">ranked by best ${km.label}</div></div>${isSprint ? "" : `<div class="small muted" style="margin-top:4px">Carry = best last 5 m as a % of sprint top speed. TO ± = how much the takeoff spot moves.</div>`}
    <div class="chips" style="margin:10px 0 4px">${withRuns.map((a) => { const i = sel.indexOf(a.id); return `<button class="chip" data-act="an-cmp" data-id="${a.id}" aria-pressed="${i >= 0}">${i >= 0 ? `<span class="dot" style="background:${ANC[i]}"></span>` : ""}${esc(a.name)}</button>`; }).join("")}</div>`;
  // overlaid trend: best key metric per day, one line per athlete
  const series = [], dots = [], allDays = new Set();
  const per = sel.map((id) => { const by = bestPerDay(runs.filter((r) => r.athleteId === id && testKey(r) === test), km.pick); Object.keys(by).forEach((d) => allDays.add(d)); return by; });
  const dl = [...allDays].sort();
  if (dl.length) {
    const t0 = new Date(dl[0]).getTime(), dx = (d) => (new Date(d).getTime() - t0) / 864e5; let lo = 1e9, hi = -1e9;
    per.forEach((by, i) => { const ds = Object.keys(by).sort(), X = ds.map(dx), Y = ds.map((d) => by[d].v); Y.forEach((y) => { lo = Math.min(lo, y); hi = Math.max(hi, y); });
      series.push({ x: X, y: Y, color: ANC[i], w: 2.4 }); X.forEach((x, j) => dots.push({ x, y: Y[j], color: ANC[i], attrs: `data-act="open-run" data-id="${by[ds[j]].r.id}" style="cursor:pointer"` })); });
    const pad = Math.max(0.08, (hi - lo) * 0.25), xEnd = Math.max(1, dx(dl[dl.length - 1]));
    h += lcSlot({ aria: "Athletes compared over time", h: 210, x0: -0.5, x1: xEnd + 0.5, y0: lo - pad, y1: hi + pad, yUnit: "m/s", yfmt: (t) => t.toFixed(2),
      xt: dl.length > 1 ? [0, xEnd] : [0], xfmt: (t) => dayLabel(t === 0 ? dl[0] : dl[dl.length - 1]), series, dots });
    h += `<div class="small muted">Best ${km.label} per day for each athlete. Tap a dot to open that run.</div>`;
  }
  // ranking with bars
  h += `<div class="rank">${rows.map((o, i) => `<div class="rk" data-act="an-ath" data-id="${o.a.id}"><span class="n">${i + 1}</span><span class="nm">${esc(o.a.name)}<small>${o.n} run${o.n > 1 ? "s" : ""} · last ${dayLabel(dayKey(o.last.ts))}</small></span>
      <span class="bar"><i style="width:${bw(o.best.v).toFixed(1)}%"></i></span><b>${f2(o.best.v)}</b></div>`).join("")}</div>`;
  // table
  const th = isSprint ? `<th>Athlete</th><th>Top<small>m/s</small></th><th>Fly 10<small>s</small></th><th>${test.split("-")[1]} m<small>s</small></th><th>Gap<small>m/s</small></th>` : `<th>Athlete</th><th>Best<small>m/s</small></th><th>Avg<small>m/s</small></th><th>Carry</th><th>Lefts</th><th>TO ±</th>`;
  const tds = (o) => isSprint
    ? `<td>${esc(o.a.name)}</td><td><b>${f2(o.best.v)}</b></td><td>${o.fly ? f2(o.fly.v) : "—"}</td><td>${o.time ? f2(o.time.v) : "—"}</td><td>${o.best.v === top ? "—" : signed(o.best.v - top)}</td>`
    : `<td>${esc(o.a.name)}</td><td><b>${f2(o.best.v)}</b></td><td>${o.avg ? f2(o.avg) : "—"}</td><td>${o.carry ? Math.round(o.carry * 100) + "%" : "—"}</td><td>${o.lefts || "—"}</td><td>${o.toSd != null ? spreadFt(o.toSd) : "—"}</td>`;
  h += `<div class="tw" style="margin-top:10px"><table class="cmpt"><thead><tr>${th}</tr></thead><tbody>${rows.map((o) => `<tr data-act="an-ath" data-id="${o.a.id}" style="cursor:pointer">${tds(o)}</tr>`).join("")}</tbody></table></div>`;
  // the main differences, written out
  const notes = [], a0 = rows[0], a1 = rows[1];
  notes.push(`${esc(a0.a.name)} has the best ${km.label}: ${f2(a0.best.v)} m/s, ${f2(a0.best.v - a1.best.v)} m/s ahead of ${esc(a1.a.name)}.`);
  if (isSprint) { const f = rows.filter((o) => o.fly).sort((x, y) => x.fly.v - y.fly.v); if (f.length > 1) notes.push(`Fastest flying 10 m: ${esc(f[0].a.name)} (${f2(f[0].fly.v)} s).`); }
  else {
    const c = rows.filter((o) => o.carry).sort((x, y) => y.carry - x.carry);
    if (c.length > 1) notes.push(`${esc(c[0].a.name)} carries the most sprint speed to the plant (${Math.round(c[0].carry * 100)}%); ${esc(c[c.length - 1].a.name)} the least (${Math.round(c[c.length - 1].carry * 100)}%).`);
    const t = rows.filter((o) => o.toSd != null).sort((x, y) => x.toSd - y.toSd);
    if (t.length > 1) notes.push(`Most consistent takeoff: ${esc(t[0].a.name)} (±${spreadFt(t[0].toSd).slice(1)}).`);
  }
  h += `<ul class="notes">${notes.map((n) => `<li>${n}</li>`).join("")}</ul><div class="small muted">Tap an athlete to see their numbers above.</div></div>`;
  return h;
}

function analyticsHTML() {
  if (!athletes.length) return `<h1>Analytics</h1><div class="card empty">Add an athlete and save some runs to see trends.</div>`;
  if (!anState.athleteId || !athletes.find((a) => a.id === anState.athleteId)) anState.athleteId = settings.lastAthlete && athletes.find((a) => a.id === settings.lastAthlete) ? settings.lastAthlete : athletes[0].id;
  const mine = runs.filter((r) => r.athleteId === anState.athleteId);
  let h = `<h1>Analytics</h1><div class="chips" style="margin-bottom:12px">${athletes.map((a) => `<button class="chip" data-act="an-ath" data-id="${a.id}" aria-pressed="${a.id === anState.athleteId}">${esc(a.name)}</button>`).join("")}</div>`;
  if (!mine.length) return h + `<div class="card empty">No runs for ${esc(athleteById(anState.athleteId).name)} yet.</div>`;
  const tests = [...new Set(mine.map(testKey))].sort();
  if (!anState.test || !tests.includes(anState.test)) anState.test = tests[0];
  h += `<div class="chips" style="margin-bottom:12px">${tests.map((t) => `<button class="chip" data-act="an-test" data-v="${t}" aria-pressed="${t === anState.test}">${testShort(t)}</button>`).join("")}</div>`;
  const tr = mine.filter((r) => testKey(r) === anState.test);
  const isSprint = anState.test.startsWith("sprint");
  // best per day
  const byDay = {}; for (const r of tr) { const v = headline(r).value; if (v == null || !isFinite(v)) continue; const k = dayKey(r.ts); if (!byDay[k] || (isSprint ? v < byDay[k].v : v > byDay[k].v)) byDay[k] = { v, r }; }
  const days = Object.keys(byDay).sort();
  if (days.length) {
    const t0 = new Date(days[0]).getTime(), X = days.map((d) => (new Date(d).getTime() - t0) / 864e5), Y = days.map((d) => byDay[d].v);
    const lo = Math.min(...Y), hi = Math.max(...Y), padY = Math.max(0.05, (hi - lo) * 0.25);
    const x1 = Math.max(1, X[X.length - 1]);
    const chart = lcSlot({ aria: "Best per day", h: 230, x0: -0.5, x1: x1 + 0.5, y0: lo - padY, y1: hi + padY, yUnit: isSprint ? "s" : "m/s",
      yfmt: (t) => t.toFixed(2), xt: X.length > 1 ? [X[0], X[X.length - 1]] : [X[0]], xfmt: (t) => dayLabel(days[X.indexOf(t)] || days[0]),
      series: [{ x: X, y: Y, color: "var(--purple)", w: 2.4, fill: !isSprint }],
      dots: X.map((x, i) => ({ x, y: Y[i], attrs: `data-act="open-session" data-id="${days[i]}" style="cursor:pointer"` })) });
    h += `<div class="card"><div class="between"><div class="label">Best ${isSprint ? "time" : "last 5 m"} per day</div><div class="small muted">${isSprint ? "lower is better" : "higher is better"}</div></div>${chart}<div class="small muted">Tap a dot to open that session.</div></div>`;
  }
  // records
  h += `<div class="card"><div class="label" style="margin-bottom:6px">Personal records · ${testName(anState.test)}</div><div class="list">`;
  const rec = (label, pick, better, fmt) => {
    const best = bestOf(tr, pick, better);
    return best ? `<div class="item" data-act="open-run" data-id="${best.r.id}"><div>${label}<div class="small muted">${dayLabel(dayKey(best.r.ts))}</div></div><div class="r">${fmt(best.v)}</div></div>` : "";
  };
  if (isSprint) {
    h += rec("Time", (r) => r.res.time, "low", (v) => `${f2(v)} s`) + rec("Top speed", (r) => r.res.top.speed, "high", (v) => `${f2(v)} m/s`) + rec("Flying 10 m", (r) => r.res.fly10 && r.res.fly10.time, "low", (v) => `${f2(v)} s`);
  } else {
    h += rec("Last 5 m", (r) => r.res.last5 && r.res.last5.speed, "high", (v) => `${f2(v)} m/s`) + rec("Top speed", (r) => r.res.top.speed, "high", (v) => `${f2(v)} m/s`);
  }
  h += `</div></div>`;
  // what matters for this test
  h += isSprint ? sprintProfileCard(mine, tr) : vaultProfileCard(tr);
  // fastest at each distance (all sprints)
  if (isSprint) {
    const sprints = mine.filter((r) => r.mode === "sprint");
    let rows = "";
    for (const x of [5, 10, 15, 20, 25, 30, 40, 50, 60]) {
      let bc = null, bs = null;
      for (const r of sprints) {
        if (r.target < x) continue;
        const tc = x === r.target ? r.res.time : interpAt(r.res.curve.d, r.res.curve.t, x);
        if (isFinite(tc) && (!bc || tc < bc.v)) bc = { v: tc, r };
        const sp = r.res.splits.find((s) => s.to === x); if (sp && (!bs || sp.time < bs.v)) bs = { v: sp.time, r };
      }

    }
    if (rows) h += `<div class="card tw"><div class="label" style="margin-bottom:6px">Fastest at each distance · all sprints</div><table><thead><tr><th>Distance</th><th>From start</th><th>5 m split</th><th>When</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  h += compareAthletesCard(anState.test);
  h += `<h2>Runs</h2>` + compareBar() + `<div class="card list">${tr.slice(0, 30).map((r) => runRow(r, true)).join("")}</div>`;
  return h;
}

document.addEventListener("click", (e) => {

    case "mid-out": settings.midOut = +v; saveSettings(); render(); break;

    case "an-cmp": { const s = anState.cmp || [], i = s.indexOf(id); if (i >= 0) { if (s.length > 1) s.splice(i, 1); } else if (s.length >= 4) toast("Up to four athletes on the chart."); else s.push(id); anState.cmp = s; render(); break; }

// ---------------- backup ----------------
function exportBackup() {
  const blob = new Blob([JSON.stringify({ app: "paytons-lidar-sensor", v: 1, athletes, runs, settings }, null, 0)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `lidar-backup-${dayKey(Date.now())}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importBackup(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result); if (!j.runs || !j.athletes) throw 0;
      const haveA = new Set(athletes.map((a) => a.id)), haveR = new Set(runs.map((r) => r.id));
      athletes = athletes.concat(j.athletes.filter((a) => !haveA.has(a.id))); runs = runs.concat(j.runs.filter((r) => !haveR.has(r.id))).sort((a, b) => b.ts - a.ts);
      saveAthletes(); saveRuns(); toast(`Imported ${j.runs.length} runs`); render();
    } catch (e) { toast("That file isn't a backup from this app."); }
  };
  fr.readAsText(file);
}
function addDemoData() {
  const people = [["Demo Athlete", 68, 0], ["Demo Vaulter 2", 74, -0.35], ["Demo Vaulter 3", 63, 0.2]];
  const now = Date.now();
  for (const [name, kg, dv] of people) {
    let a = athletes.find((x) => x.name === name);
    if (!a) { a = { id: uid(), name, kg }; athletes.push(a); }
    for (let day = 13; day >= 0; day -= 3) {
      for (let rep = 0; rep < 2; rep++) {
        const ts = now - day * 864e5 - (3 - rep) * 600e3;
        const vmax = 8.7 + dv + (13 - day) * 0.03 + Math.random() * 0.15;
        const s = Engine.simulate({ seed: Math.floor(Math.random() * 1e6) + 1, vmax, target: 30, back: 3 });
        const res = Engine.process(s.raw, { mode: "sprint", target: 30, mass: a.kg });
        if (!res.error) runs.push({ id: uid(), ts, athleteId: a.id, mode: "sprint", target: 30, res });
        const setup = ["runway100", "runway150", "polerun100"][(day / 3 + rep) % 3 | 0];
        const steps = setup === "runway150" ? 19 + (rep % 2) : 15 + (rep % 2);
        const carry = 0.55 + (name.endsWith("2") ? 0.25 : 0) + Math.random() * 0.2;
        const sv = Engine.simulate({ seed: Math.floor(Math.random() * 1e6) + 1, vmax: vmax - carry, steps, back: 2.5, popup: !!SETUPS[setup].pole, flight: 0.55 });
        const ctx = { mode: "vault", setup, mass: a.kg };
        {
          const probe = Engine.process(sv.raw, Object.assign({ noBox: true }, ctx)), box = SETUPS[setup].boxFt * FT;
          if (!probe.error) { const shift = Math.round((box - (11 + Math.random() * 2.5) * FT - 0.5 - probe.takeoff.sensor) * 100); sv.raw.d = sv.raw.d.map((cm) => (cm > 0 ? Math.max(1, cm + shift) : cm)); }
        }
        const rv = Engine.process(sv.raw, ctx);
        if (!rv.error) runs.push({ id: uid(), ts: ts + 300e3, athleteId: a.id, mode: "vault", setup, res: rv });
      }
    }
  }
  saveAthletes(); runs.sort((x, y) => y.ts - x.ts); saveRuns(); toast("Demo data added"); render();
}

function sprintSummary(run, name) {

      <div class="box"><h4>Speed at each left</h4>${lefts.map((s) => bar(`${s.takeoff ? "TO" : "L" + s.num} · ${Math.round(s.spot)}'`, s.speed, ref, s.takeoff ? ACC : ACC2, f2(s.speed))).join("")}
        <div style="color:${INK2};font-size:11px;margin-top:4px">Bars are measured against ${sp ? "sprint top speed" : "runway top speed"}. They should keep growing to the takeoff.</div></div></div>
    </div>
    <div class="box"><h4>How to use this as a vaulter</h4><div class="guide">
      <div><b>Last 5 m into takeoff</b><p>The speed you bring to the plant, and the speed the pole has to work with. Faster here, with the same takeoff, means a stiffer pole and a higher grip. This is the number to chase.</p></div>
      <div><b>% of sprint top speed</b><p>How much of your max speed survives the pole carry. If it's low, the run-up is costing you speed: work on carry posture, relaxed arms and a steady rhythm. If it's high, the next jump in speed has to come from sprint training.</p></div>
      <div><b>Speed at each left</b><p>Should keep rising, or at least hold, all the way to takeoff. A dip at the last 2–3 lefts means slowing down to find the box or reaching for the plant.</p></div>
      <div><b>Step length (grey rights in between)</b><p>Steps should get a little shorter and quicker at the end, not longer. Overstriding in the last steps usually shows up as a speed drop into takeoff.</p></div>
      <div><b>Lefts, takeoff and start mark</b><p>The same lefts with a takeoff that keeps moving means the run-up is changing. Use the takeoff distance to move the start mark, and keep the left count the same while speed improves.</p></div>
      <div><b>Run-up length</b><p>The sprint report shows where you reach 98% of top speed. If your approach is shorter than that, you plant before you're at full speed. Add a left if you can still control it.</p></div>
    </div></div>
    ${footer(2, 2)}</div>`;
  return p1 + p2;
}

// ---------- session report: everyone who ran in one session ----------
const SESS_COLORS = ["#e0147a", "#7444e8", "#0f8fd6", "#e08a00", "#13a35f", "#5b5680"];
function sessionReport(list) {
  list = list.slice().sort((a, b) => a.ts - b.ts);
  const t0 = list[0].ts, t1 = list[list.length - 1].ts, d = new Date(t0);
  const when = `${d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric", year: "numeric" })} · ${timeLabel(t0)}–${timeLabel(t1)}`;
  const tests = [...new Set(list.map(testKey))], aids = [...new Set(list.map((r) => r.athleteId))];
  const head = `<div class="rhead"><span>LiDAR SENSOR</span><span>SESSION REPORT</span></div>`;
  const sprints = list.filter((r) => r.mode === "sprint"), vaults = list.filter((r) => r.mode === "vault" && r.res.last5);
  const best = (arr, pick) => arr.reduce((p, q) => (!p || pick(q) > pick(p) ? q : p), null);
  const bS = best(sprints, (r) => r.res.top.speed), bV = best(vaults, (r) => r.res.last5.speed);
  const color = (aid) => SESS_COLORS[aids.indexOf(aid) % SESS_COLORS.length];
  const m = (k, v, u, sub, cls) => `<div class="m ${cls || ""}"><div class="k">${k}</div><div class="v">${v}${u ? `<small>${u}</small>` : ""}</div>${sub ? `<div class="k" style="margin-top:2px">${sub}</div>` : ""}</div>`;
  // one row per athlete and test
  let rowsA = "";
  for (const t of tests) for (const aid of aids) {
    const rs = list.filter((r) => r.athleteId === aid && testKey(r) === t); if (!rs.length) continue;
    const name = `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color(aid)};margin-right:6px"></span>${esc(athleteById(aid).name)}`;
    if (t.startsWith("sprint")) {
      const top = Math.max(...rs.map((r) => r.res.top.speed)), tm = Math.min(...rs.map((r) => r.res.time)), fl = rs.map((r) => r.res.fly10 && r.res.fly10.time).filter(Boolean);
      rowsA += `<tr><td>${name}</td><td>${testShort(t)}</td><td>${rs.length}</td><td><b>${f2(top)} m/s</b> top speed</td><td>fly 10 ${fl.length ? f2(Math.min(...fl)) + " s" : "–"}</td><td>${f2(tm)} s best time</td><td></td></tr>`;
    } else {
      const v = rs.filter((r) => r.res.last5), l5 = v.length ? Math.max(...v.map((r) => r.res.last5.speed)) : null, top = Math.max(...rs.map((r) => r.res.top.speed));
      const L = rs.map((r) => r.res.steps.lefts).filter(Boolean), TO = rs.map((r) => r.res.takeoff.outFt).filter((x) => x != null);
      rowsA += `<tr><td>${name}</td><td>${testShort(t)}</td><td>${rs.length}</td><td><b>${l5 ? f2(l5) + " m/s" : "–"}</b> last 5 m</td><td>top ${f2(top)} m/s</td><td>${L.length ? (Math.min(...L) === Math.max(...L) ? L[0] : `${Math.min(...L)}–${Math.max(...L)}`) + " lefts" : "–"}</td><td>${TO.length ? ftLabel(TO.reduce((a, b) => a + b, 0) / TO.length) + " avg" : "–"}</td></tr>`;
    }
  }
  // chart: each athlete's best run of the most common test
  const main = tests.map((t) => [t, list.filter((r) => testKey(r) === t).length]).sort((a, b) => b[1] - a[1])[0][0], isS = main.startsWith("sprint");
  const series = [], legendItems = [];
  for (const aid of aids) {
    const rs = list.filter((r) => r.athleteId === aid && testKey(r) === main && (isS || r.res.last5)); if (!rs.length) continue;
    const b = best(rs, (r) => (isS ? r.res.top.speed : r.res.last5.speed)), c = b.res.curve;
    if (isS) { let k = c.d.findIndex((x) => x > b.target); if (k < 0) k = c.d.length; const k0 = Math.max(0, c.t.findIndex((t) => t >= 0)); series.push({ x: c.d.slice(k0, k), y: c.v.slice(k0, k), color: color(aid), w: 2.4 }); }
    else { const xs = c.d.map((x) => (x - b.res.takeoff.dist) / FT); let k = xs.findIndex((x) => x > 0); if (k < 0) k = xs.length; series.push({ x: xs.slice(0, k), y: c.v.slice(0, k), color: color(aid), w: 2.4 }); }
    legendItems.push([SW_LINE(color(aid)), `${esc(athleteById(aid).name)} · ${isS ? f2(b.res.top.speed) + " m/s top" : f2(b.res.last5.speed) + " m/s last 5 m"}`]);
  }
  const ymax = Math.ceil(Math.max(...series.map((s) => Math.max(...s.y))) + 1);
  const xa = isS ? 0 : Math.max(-140, Math.floor(Math.min(...series.map((s) => s.x[0])) / 10) * 10), xb = isS ? Math.max(...list.filter((r) => testKey(r) === main).map((r) => r.target)) : 0;
  const chart = series.length ? svgChart({ aria: "Best runs compared", w: 730, h: 175, pad: [44, 14, 14, 40], x0: xa, x1: xb, y0: 0, y1: ymax, font: 11, textColor: INK2, gridColor: "#efecf6",
    xt: niceTicks(xa, xb, 10), xfmt: (t) => (isS ? `${t} m` : t === 0 ? "takeoff" : `${Math.abs(t)} ft`), yt: niceTicks(0, ymax, 5), xl: isS ? "Distance (m)" : "Distance before takeoff (ft)", yl: "Speed (m/s)",
    shades: isS ? [] : [{ a: -5 / FT, b: 0, color: ACC2, op: 0.1 }], series }) : "";
  const pageRows = 30, all = list.map((r, i) => {
    const R = r.res, a = athleteById(r.athleteId);
    const main = r.mode === "sprint" ? `${f2(R.time)} s` : R.last5 ? `${f2(R.last5.speed)} m/s` : "–";
    const extra = r.mode === "sprint" ? (R.fly10 ? `fly 10 ${f2(R.fly10.time)} s` : "") : [R.steps.counted ? `${R.steps.lefts} lefts` : "", R.takeoff.outFt != null ? `TO ${ftLabel(R.takeoff.outFt)}` : ""].filter(Boolean).join(" · ");
    return `<tr><td>${i + 1}</td><td>${timeLabel(r.ts)}</td><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color(r.athleteId)};margin-right:6px"></span>${esc(a.name)}</td><td>${testShort(testKey(r))}</td><td><b>${main}</b></td><td>${f2(R.top.speed)} m/s</td><td>${extra}</td></tr>`;
  });
  const firstRows = 8, chunks = [all.slice(0, firstRows)]; for (let i = firstRows; i < all.length; i += pageRows) chunks.push(all.slice(i, i + pageRows));
  const P = chunks.length, thead = `<thead><tr><th style="text-align:left">#</th><th style="text-align:left">Time</th><th style="text-align:left">Athlete</th><th style="text-align:left">Test</th><th style="text-align:left">Result</th><th style="text-align:left">Top speed</th><th style="text-align:left">Details</th></tr></thead>`;
  const runsBox = (rows, cont) => `<div class="box"><h4>All runs${cont ? " (continued)" : ""}</h4><table class="srun">${thead}<tbody>${rows.join("")}</tbody></table></div>`;
  let h = `<div class="page">${head}
    <div class="box btop">${brandBlock(`Session report<br>TF03 LiDAR · 1000 Hz · <b style="color:${INK}">${UNC}</b>`)}
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:12px;flex-wrap:wrap">
        <div><div class="eyebrow">TRAINING SESSION · ${tests.map(testName).join(" · ").toUpperCase()}</div><div class="who">${aids.length} athlete${aids.length > 1 ? "s" : ""}, ${list.length} run${list.length > 1 ? "s" : ""}</div></div>
        <div style="color:${INK2};font-size:13px">${when}</div></div>
      <div class="metrics" style="grid-template-columns:repeat(4,1fr)">
        ${m("Runs", list.length, "", `${Math.max(1, Math.round((t1 - t0) / 60000))} min`)}
        ${m("Athletes", aids.length, "", aids.slice(0, 3).map((x) => esc(athleteById(x).name.split(" ")[0])).join(", ") + (aids.length > 3 ? "…" : ""))}
        ${m("Fastest top speed", bS ? f2(bS.res.top.speed) : "—", bS ? "m/s" : "", bS ? esc(athleteById(bS.athleteId).name) : "no sprints")}
        ${m("Best last 5 m", bV ? f2(bV.res.last5.speed) : "—", bV ? "m/s" : "", bV ? esc(athleteById(bV.athleteId).name) : "no vault runs")}
      </div></div>
    <div class="box"><h4>Each athlete's best</h4><table class="srun"><thead><tr><th style="text-align:left">Athlete</th><th style="text-align:left">Test</th><th style="text-align:left">Runs</th><th style="text-align:left">Best</th><th style="text-align:left">Also</th><th style="text-align:left"></th><th style="text-align:left"></th></tr></thead><tbody>${rowsA}</tbody></table></div>
    ${series.length ? `<div class="box"><h4>Best ${isS ? "sprint" : "approach"} for each athlete · ${testName(main)}</h4>${chart}${legend(legendItems)}</div>` : ""}
    ${runsBox(chunks[0], false)}
    ${footer(1, P)}</div>`;
  for (let i = 1; i < P; i++) h += `<div class="page">${head}${runsBox(chunks[i], true)}${footer(i + 1, P)}</div>`;
  return h;
}
function openSessionReport(ids) {
  const list = runs.filter((r) => ids.includes(r.id));
  if (!list.length) { toast("No saved runs in this session."); return; }
  const el = $("#report");
  el.innerHTML = `<div class="bar"><button data-rep="close">‹ Close</button><button data-rep="print">Print / Save PDF</button></div>` + sessionReport(list);
  el.classList.remove("hidden"); el.scrollTop = 0;
  const fit = () => { const w = Math.min(1, (window.innerWidth - 16) / 816); el.querySelectorAll(".page").forEach((p) => { p.style.zoom = w < 1 ? w : ""; }); };
  fit(); window.addEventListener("resize", fit, { once: true });
}

function openReport(id) {
  const run = runs.find((r) => r.id === id) || (cap.run && cap.run.id === id ? cap.run : null);
  if (!run) return;
  const el = $("#report");
  el.innerHTML = `<div class="bar"><button data-rep="close">‹ Close</button><button data-rep="print">Print / Save PDF</button></div>` + (run.mode === "sprint" ? sprintReport(run) : vaultReport(run));
  el.classList.remove("hidden"); el.scrollTop = 0;
  // fit the letter-size pages to the phone screen
  const fit = () => { const w = Math.min(1, (window.innerWidth - 16) / 816); el.querySelectorAll(".page").forEach((p) => { p.style.zoom = w < 1 ? w : ""; }); };
  fit(); window.addEventListener("resize", fit, { once: true });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-rep]"); if (!b) return;
  if (b.dataset.rep === "close") { $("#report").classList.add("hidden"); $("#report").innerHTML = ""; }
  if (b.dataset.rep === "print") { $("#report").querySelectorAll(".page").forEach((p) => (p.style.zoom = "")); window.print(); setTimeout(() => { const w = Math.min(1, (window.innerWidth - 16) / 816); $("#report").querySelectorAll(".page").forEach((p) => (p.style.zoom = w < 1 ? w : "")); }, 500); }
});


// ---------------- start ----------------
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
render(); pollLoop();
})();
