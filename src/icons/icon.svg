<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- the app's own gradient (the New run button, --tint-strong over white): pink, purple, blue at 135 degrees -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbcda"/><stop offset=".5" stop-color="#dacbfc"/><stop offset="1" stop-color="#b8e8ff"/></linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <!-- the mark: the case side-on (purple lid, body, quick-release block) with three speed lines -->
  <rect x="13" y="34" width="54" height="8" rx="3" fill="#7444e8"/><rect x="13" y="44" width="54" height="22" rx="4" fill="#1d1a26"/><path d="M32 68 H48 L51 74 H29 Z" fill="#0f8fd6"/><g stroke="#1d1a26" stroke-width="4" stroke-linecap="round"><path d="M74 47 H88"/><path d="M74 55 H84"/><path d="M74 63 H88"/></g>
</svg>
