<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- the sensor's boot screen: the logo on its near-black background, with the gradient loading bar under it.
       Everything sits inside the middle 80% so Android's round (maskable) crop keeps it whole. -->
  <defs><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#ff2d8a"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22b8ff"/></linearGradient></defs>
  <rect width="100" height="100" fill="#0b0915"/>
  <g transform="translate(18.4 27) scale(.8)">
    <rect x="0" y="0" width="54" height="8" rx="3" fill="#8b5cf6"/>
    <rect x="0" y="10" width="54" height="22" rx="4" fill="#2a2636"/>
    <rect x="19" y="34" width="16" height="6" rx="1" fill="#22b8ff"/>
    <g stroke="#cfc8e6" stroke-width="4" stroke-linecap="round"><path d="M61 13H75"/><path d="M61 21H71"/><path d="M61 29H75"/></g>
  </g>
  <rect x="26" y="66" width="48" height="3" rx="1.5" fill="url(#bar)"/>
</svg>
